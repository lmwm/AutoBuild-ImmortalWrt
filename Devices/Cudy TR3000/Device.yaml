# Cudy TR3000 设备配置（唯一配置文件：设备参数 + 软件包列表）
# 目录名：Devices/Cudy TR3000（与 device 下拉选项保持一致，保留空格）
# 由 FullBuild.yml / ImageBuilder.yml 的 [1.3] 与 [3.3] 读取
#
# 结构约定（解析依赖，勿改动）：
#   - 设备参数键（Model / Model_dts / Target）顶格书写、首字母大写
#   - 软件包列表段（enable / disable / disable_components）放在文件最后
#   - 段内条目一律 "  - 名称" 形式；注释行以 # 开头

# ============================================================
# 设备参数
# ============================================================

# 设备型号（用于固件命名与 Artifact 命名）
Model: "Cudy TR3000"

# DTS 中的原始型号名（dtb model 属性）
# ImageBuilder 工作流：[IB.3] 在 make image 前把 IB 内 DTS 里的此字符串替换为
#   Model（make image 会现场编译 dtb，型号改名在 dtb 层生效，全链路自动正确）
# FullBuild 工作流：由 Build.sh 的设备定制段处理，与此字段无关
# 可选；缺失或与 Model 相同则跳过型号替换
Model_dts: "Cudy TR3000 v1 (OpenWrt U-Boot layout)"

# 设备 TARGET（用于 make defconfig）
Target: "CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3000-v1-ubootmod=y"

# ============================================================
# 软件包配置（工作流据此生成 .config 与 packages_list.txt）
# 依赖会由 make defconfig 自动处理
# ============================================================

# 启用的包
enable:
  # LuCI 中文支持
  # LuCI 翻译按包分发：luci-i18n-base-zh-cn 覆盖 luci-base 的界面文案
  # （核心模块 luci-mod-status / system / network 的字符串也收录在 base.po，
  #   概览页"型号/主机名/固件版本"等即来自它，无独立语言包）；
  # 各 luci-app 与 luci-mod-dashboard 的翻译是独立的 luci-i18n-<名>-zh-cn
  # 包，不单独安装，对应页面就是英文。zh-cn 是 zh_Hans 的别名
  # （luci.mk 的 LUCI_LC_ALIAS），指向同一个包。
  # 注意：启用新的 luci-app 时记得同步补它的 luci-i18n-<名>-zh-cn。
  - luci-i18n-base-zh-cn
  - luci-i18n-dashboard-zh-cn
  - luci-i18n-mwan3-zh-cn
  - luci-i18n-ttyd-zh-cn
  - luci-i18n-wol-zh-cn
  - luci-i18n-autoreboot-zh-cn
  # luci-i18n-openclash-zh-cn 在官方源中不存在，禁止启用（启用会让
  # make image 报 "no such package" 失败，2026-09-26 实测）：
  # OpenClash 的 po 目录名是旧式 zh-cn，不在 luci.mk 的 LUCI_LANG 白名单
  #（白名单只有 zh_Hans），官方构建不生成它的语言包。
#  - luci-i18n-openclash-zh-cn
  - luci-i18n-argon-config-zh-cn
  # 下面两个是 luci 默认集应用（luci-app-firewall / luci-app-package-manager）
  # 的翻译包：full 模式的 defconfig 会按 luci.mk 的 DEFAULT:=LUCI_LANG_*
  # 自动带上，ImageBuilder 的 apk 依赖解析则不会。显式列出保证两种模式
  # 的固件语言一致（否则 ImageBuilder 固件里这两个页面是英文）。
  - luci-i18n-firewall-zh-cn
  - luci-i18n-package-manager-zh-cn

  # LuCI 主题
  - luci-theme-argon

  # LuCI 应用
  - luci-app-autoreboot
  - luci-app-mwan3
  - luci-app-ttyd
  # - luci-app-upnp
  - luci-app-wol
  - luci-app-openclash
  # - luci-app-harbor-file
  - luci-mod-dashboard
  - luci-app-argon-config

  # 网络工具
  - etherwake
  - wakeonlan
  - openssh-sftp-server
  - usbutils

  # 内核模块
  - kmod-mtd-rw
  # 内核 TLS 卸载模块。kmod-bonding 的条件依赖
  # （DEPENDS:=PACKAGE_kmod-tls:kmod-tls）在 ImageBuilder 的 apk 元数据里
  # 会被当成无条件依赖自动拉入，full 模式的 Kconfig 解析则不会；
  # 显式列出保证两种模式一致，也让 bonding 具备 TLS 卸载能力。
  - kmod-tls
  - kmod-usb-net-cdc-ncm
  - kmod-usb-net-cdc-mbim
  - kmod-usb-net-cdc-ether
  - kmod-usb-net-qmi-wwan
  - kmod-usb-net-cdc-eem
  - kmod-usb2
  - kmod-usb-net-rndis
  - kmod-vrf
  - kmod-bonding
  - kmod-ipt-fullconenat
  - kmod-ipt-nat
  - kmod-ipt-conntrack

  # 其他工具
  - wget-ssl
  - libpcre2

# 禁用的包（本体）
disable:
  - luci-app-passwall
  - luci-app-rclone

# 禁用的子组件（按需添加）
disable_components:
  luci-app-passwall:
    - INCLUDE_Haproxy
    - INCLUDE_Hysteria
    - INCLUDE_NaiveProxy
    - INCLUDE_Shadowsocks_Rust_Client
    - INCLUDE_Shadowsocks_Rust_Server
    - INCLUDE_Shadow_TLS
    - INCLUDE_Simple_Obfs
    - INCLUDE_SingBox
    - INCLUDE_V2ray_Geodata
    - INCLUDE_V2ray_Geoview
    - INCLUDE_V2ray_Plugin
    - INCLUDE_Xray
    - INCLUDE_Xray_Plugin
  luci-app-rclone:
    - INCLUDE_rclone-webui
    - INCLUDE_rclone-ng
