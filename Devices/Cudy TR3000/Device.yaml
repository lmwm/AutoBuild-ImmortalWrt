# Cudy TR3000 设备配置：设备参数 + 软件包列表，由 FullBuild.yml [1.3] 与 [3.3] 读取
# （Build.sh 另读 Model / Model_dts 做 DTS 改名）。
# 结构约定：参数键顶格书写；列表段放文件末尾；条目一律 "  - 名称" 形式。

# 设备型号（用于固件命名与 Artifact 命名）
Model: "Cudy TR3000"

# DTS 中的原始型号名（dtb model 属性），可选；
# Build.sh 会把它替换为 Model；缺失或与 Model 相同则跳过
Model_dts: "Cudy TR3000 v1 (OpenWrt U-Boot layout)"

# 设备 TARGET（用于 make defconfig）
Target: "CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3000-v1-ubootmod=y"

# 软件包配置：工作流据此生成 .config，依赖由 make defconfig 自动处理

# 启用的包
enable:
  # LuCI 翻译按包分发：luci-i18n-base-zh-cn 覆盖 luci-base 与核心模块文案，
  # 各 luci-app / luci-mod-dashboard 需另装 luci-i18n-<名>-zh-cn，启用新应用时记得补上。
  - luci-i18n-base-zh-cn
  - luci-i18n-dashboard-zh-cn
  - luci-i18n-ttyd-zh-cn
  - luci-i18n-autoreboot-zh-cn
  # luci-i18n-openclash-zh-cn 在官方源中不存在，启用会让 make image 失败（2026-09-26 实测）
  #  - luci-i18n-openclash-zh-cn
  - luci-i18n-argon-config-zh-cn
  # luci 默认集应用的翻译，显式列出以免依赖上游默认值变化
  - luci-i18n-firewall-zh-cn
  - luci-i18n-package-manager-zh-cn

  # LuCI 主题
  - luci-theme-argon

  # LuCI 应用
  - luci-app-autoreboot
  - luci-app-ttyd
  # - luci-app-upnp
  - luci-app-openclash
  - luci-mod-dashboard
  - luci-app-argon-config

  # 网络工具
  - etherwake
  - wakeonlan
  - openssh-sftp-server
  - usbutils

  # 内核模块
  - kmod-mtd-rw
  # kmod-bonding 对 kmod-tls 是条件依赖，Kconfig 不会自动选中，故显式列出
  - kmod-tls
  - kmod-usb-net-cdc-ncm
  - kmod-usb-net-cdc-mbim
  - kmod-usb-net-cdc-ether
  - kmod-usb-net-qmi-wwan
  - kmod-usb-net-cdc-eem
  - kmod-usb2
  - kmod-usb-net-rndis
  - kmod-vrf
  - kmod-bonding
  - kmod-ipt-fullconenat
  - kmod-ipt-nat
  - kmod-ipt-conntrack

  # 其他工具
  - wget-ssl
  - libpcre2

# 禁用的包（本体）
disable:
  - luci-app-harbor-file
  - luci-app-mwan3
  - luci-app-passwall
  - luci-app-rclone
  - luci-app-wol

# 禁用的子组件
disable_components:
  luci-app-passwall:
    - INCLUDE_Haproxy
    - INCLUDE_Hysteria
    - INCLUDE_NaiveProxy
    - INCLUDE_Shadowsocks_Rust_Client
    - INCLUDE_Shadowsocks_Rust_Server
    - INCLUDE_Shadow_TLS
    - INCLUDE_Simple_Obfs
    - INCLUDE_SingBox
    - INCLUDE_V2ray_Geodata
    - INCLUDE_V2ray_Geoview
    - INCLUDE_V2ray_Plugin
    - INCLUDE_Xray
    - INCLUDE_Xray_Plugin
  luci-app-rclone:
    - INCLUDE_rclone-webui
    - INCLUDE_rclone-ng
