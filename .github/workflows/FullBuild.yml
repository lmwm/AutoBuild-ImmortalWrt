#
# 全量编译工作流：从源码编译内核/工具链/软件包，可改内核、DTS 与设备定制。
# 仓库：https://github.com/lmwm/AutoBuild-ImmortalWrt
# 设备参数与包列表读 Devices/<设备>/Device.yaml，外部包与定制由 Build.sh 执行；
# 版本标签下拉选项由 SyncVersions.yml 定时维护。
#

name: "编译 ImmortalWrt 固件（全量编译）"

on:
  workflow_dispatch:
    inputs:
      device:
        description: "目标设备"
        type: choice
        options:
          - "Cudy TR3000"
        default: "Cudy TR3000"
        required: true
      tag:
        description: "ImmortalWrt 版本标签"
        type: choice
        options:
          - latest
          - "v25.12.2"
          - "v25.12.1"
          - "v25.12.0"
          - "v24.10.6"
        default: latest
        required: true
      cache_enabled:
        description: "启用编译缓存（ccache + 源码下载 dl；不含构建树）"
        type: boolean
        default: true
      skip_compile:
        description: "跳过编译（调试模式）"
        type: boolean
        default: false
      ruby_yjit:
        description: "启用 ruby YJIT（关闭可甩掉整个 Rust/LLVM 工具链，省 60-130 分钟）"
        type: boolean
        default: true

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    name: "编译固件"
    timeout-minutes: 360

    steps:
      # 阶段 1: 系统环境初始化

      - name: "[1.1] 系统信息"
        run: |
          echo "=========================================="
          echo "  系统信息"
          echo "=========================================="
          echo ""

          echo "[系统]"
          echo "  OS: $(cat /etc/os-release | grep PRETTY_NAME | cut -d= -f2 | tr -d '"')"
          echo "  Kernel: $(uname -r)"
          echo "  Arch: $(uname -m)"
          echo ""

          echo "[CPU]"
          CPU_MODEL=$(grep "model name" /proc/cpuinfo 2>/dev/null | head -1 | cut -d: -f2 | xargs)
          CPU_CORES=$(nproc 2>/dev/null || echo "未知")
          echo "  型号: ${CPU_MODEL:-未知}"
          echo "  核心: ${CPU_CORES} 核"
          echo ""

          echo "[内存]"
          free -h | awk '/^Mem:/ {printf "  总量: %s\n  已用: %s\n  可用: %s\n", $2, $3, $7}'
          echo ""

          echo "[磁盘]"
          echo "  工作目录: $GITHUB_WORKSPACE"
          df -hT "$GITHUB_WORKSPACE" | awk 'NR==2 {printf "  文件系统: %s\n  总量: %s\n  已用: %s (%s)\n  可用: %s\n", $1, $2, $3, $5, $4}'
          echo ""

          echo "=========================================="

      - name: "[1.2] 克隆配置仓库"
        uses: actions/checkout@v4

      - name: "[1.3] 加载设备配置"
        id: device
        run: |
          DEVICE="${{ inputs.device }}"
          # 下拉选项值即目录名（含空格，如 "Cudy TR3000"）
          DEVICE_DIR="Devices/${DEVICE}"
          CONF="${DEVICE_DIR}/Device.yaml"

          if [ ! -f "$CONF" ]; then
            echo "::error::设备配置不存在: $CONF"
            exit 1
          fi

          # 值可能带空格，用 sed 而非 awk；'^Model:' 不会误匹配 '^Model_dts:'
          DEVICE_MODEL=$(grep '^Model:' "$CONF" | sed 's/^Model: *//' | tr -d '"' | tr -d "'")
          MODEL_DTS=$(grep '^Model_dts:' "$CONF" | sed 's/^Model_dts: *//' | tr -d '"' | tr -d "'")
          DEVICE_TARGET=$(grep '^Target:' "$CONF" | sed 's/^Target: *//' | tr -d '"' | tr -d "'")

          if [ -z "$DEVICE_MODEL" ] || [ -z "$DEVICE_TARGET" ]; then
            echo "::error::${CONF} 缺少 Model 或 Target 字段"
            exit 1
          fi

          # 从 TARGET 推导平台标识，用于缓存键隔离
          # CONFIG_TARGET_mediatek_filogic_DEVICE_xxx=y -> mediatek-filogic
          PLATFORM_SLUG=""
          if [ -n "$DEVICE_TARGET" ]; then
            PLATFORM_SLUG=$(echo "$DEVICE_TARGET" \
              | sed 's/^CONFIG_TARGET_//' \
              | sed 's/_DEVICE_.*$//' \
              | sed 's/_/-/g')
          fi
          if [ -z "$PLATFORM_SLUG" ]; then
            echo "::error::无法从 target 解析平台标识: ${DEVICE_TARGET}"
            exit 1
          fi

          echo "device_dir=${DEVICE_DIR}" >> $GITHUB_OUTPUT
          echo "model=${DEVICE_MODEL}" >> $GITHUB_OUTPUT
          echo "target=${DEVICE_TARGET}" >> $GITHUB_OUTPUT
          echo "platform=${PLATFORM_SLUG}" >> $GITHUB_OUTPUT

          echo "=========================================="
          echo "  设备配置"
          echo "=========================================="
          echo "  设备: ${DEVICE}"
          echo "  设备目录: ${DEVICE_DIR}"
          echo "  型号: ${DEVICE_MODEL}"
          echo "  DTS 原始型号: ${MODEL_DTS:-（未设置）}"
          echo "  平台: ${PLATFORM_SLUG}"
          echo "  TARGET: ${DEVICE_TARGET}"
          echo "=========================================="

      # 阶段 2: 源码准备

      - name: "[2.1] 安装编译环境"
        run: |
          echo "=========================================="
          echo "  安装编译环境"
          echo "=========================================="

          sudo apt-get update -y

          sudo apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man \
            intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev \
            libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev \
            libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip \
            p7zip-full patch pkgconf python3 python3-pip python3-ply \
            python3-docutils python3-pyelftools python3-setuptools qemu-utils \
            re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "[OK] 编译环境安装完成"
          echo "=========================================="

      - name: "[2.2] 获取版本标签"
        run: |
          echo "=========================================="
          echo "  获取 ImmortalWrt 版本标签（实时）"
          echo "=========================================="

          UPSTREAM="https://github.com/immortalwrt/immortalwrt.git"

          # 先落盘再过滤，$? 才反映 git 的退出码（管道会掩盖）
          for attempt in 1 2 3; do
            if git ls-remote --tags --sort=-v:refname "$UPSTREAM" > tags_raw.txt 2>/dev/null; then
              grep -oP 'refs/tags/\K[v0-9.]+$' tags_raw.txt > tags_all.txt || true
              if [ -s tags_all.txt ]; then
                echo "[OK] 标签获取成功（第 ${attempt} 次尝试）"
                break
              fi
            fi

            echo "[WARN] 获取标签失败，5 秒后重试（第 ${attempt}/3 次）"
            sleep 5
          done

          if [ ! -s tags_all.txt ]; then
            echo "::error::无法从上游获取版本标签，请稍后重试"
            exit 1
          fi

          # 去重（annotated tag 可能重复），保持上游的版本倒序
          awk '!seen[$0]++' tags_all.txt > tags.txt

          echo "[OK] 上游可用版本标签（最新在前）:"
          sed 's/^/  - /' tags.txt
          echo ""

      - name: "[2.3] 确定版本标签"
        id: version
        run: |
          INPUT_TAG="${{ inputs.tag }}"
          LATEST_TAG=$(head -1 tags.txt)

          echo "=========================================="
          echo "  确定 ImmortalWrt 版本"
          echo "=========================================="

          if [ "$INPUT_TAG" = "latest" ]; then
            TAG="$LATEST_TAG"
            echo "[OK] latest -> 最新版本: $TAG"
          else
            TAG="$INPUT_TAG"
            if ! grep -qxF "$TAG" tags.txt; then
              echo "::error::版本标签不存在: $TAG"
              echo "[ERROR] 上游当前可用标签:"
              sed 's/^/  - /' tags.txt
              exit 1
            fi
            echo "[OK] 使用指定版本: $TAG"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "  上游最新版本: ${LATEST_TAG}"

          echo "=========================================="

      - name: "[2.4] 克隆 ImmortalWrt 源码"
        run: |
          git clone -b ${{ steps.version.outputs.tag }} \
            --single-branch --filter=blob:none \
            https://github.com/immortalwrt/immortalwrt.git \
            /tmp/immortalwrt
          ln -sf /tmp/immortalwrt $GITHUB_WORKSPACE/immortalwrt

      - name: "[2.5] 更新 feeds"
        working-directory: immortalwrt
        run: ./scripts/feeds update -a

      - name: "[2.6] 安装 feeds"
        working-directory: immortalwrt
        run: ./scripts/feeds install -a

      # 构建树缓存（含已删除的 [2.7] 时间戳重置）体积超 GitHub 配额，且裁剪曾误删 core.h；
      # 现每次从零编译，加速由 ccache 承担。详见 README「编译缓存」。

      # 阶段 3: 自定义固件

      - name: "[3.1] 执行 Build.sh（外部包 + 设备定制）"
        run: |
          DEVICE_DIR="${{ steps.device.outputs.device_dir }}"
          DEVICE_ABS="$GITHUB_WORKSPACE/${DEVICE_DIR}"
          if [ -f "${DEVICE_ABS}/Build.sh" ]; then
            chmod +x "${DEVICE_ABS}/Build.sh"
            # 脚本在 cd 进源码树后执行，必须以绝对路径传入设备目录，
            # 否则相对路径找不到 files/（2026-10-20 修复；run 39017537068 曾静默跳过）。
            cd immortalwrt && DEVICE_DIR="$DEVICE_ABS" bash "${DEVICE_ABS}/Build.sh"
          else
            echo "[INFO] 无 Build.sh，跳过"
          fi

      - name: "[3.3] 生成编译配置"
        run: |
          DEVICE_DIR="${{ steps.device.outputs.device_dir }}"
          DEVICE_TARGET="${{ steps.device.outputs.target }}"

          echo "=========================================="
          echo "  生成编译配置"
          echo "=========================================="

          # 创建初始配置：写入设备 TARGET
          # （immortalwrt 是 [2.4] 建立的符号链接，此处防御性 mkdir）
          mkdir -p immortalwrt
          echo "$DEVICE_TARGET" > immortalwrt/.config
          echo "[OK] 设置设备 TARGET: $DEVICE_TARGET"

          # 解析 enable / disable / disable_components，只认 "  - 名称" 条目。
          # 单次扫描，顶格键名切换段，未登记的段名直接忽略（避免上一段状态串用）。
          PACKAGES_FILE="${DEVICE_DIR}/Device.yaml"
          if [ -f "$PACKAGES_FILE" ]; then

            section=""
            current_pkg=""
            while IFS= read -r line; do
              # 注释行与空行跳过（`# - pkg` 即临时停用该包）
              case "$line" in
                \#*|"") continue ;;
              esac

              # 子组件段里的包名（缩进键名，如 "  luci-app-passwall:"）
              if [ "$section" = "disable_components" ] \
                && printf '%s' "$line" | grep -qE '^[[:space:]]+[A-Za-z0-9_.+-]+:'; then
                current_pkg=$(printf '%s' "$line" | sed 's/^[[:space:]]*//; s/:.*//' | xargs)
                continue
              fi

              # 顶格键名：切换当前段；未登记的段名按「无段」处理，其条目忽略
              if printf '%s' "$line" | grep -qE '^[A-Za-z_][A-Za-z0-9_]*:'; then
                section=$(printf '%s' "$line" | sed 's/:.*//')
                current_pkg=""
                case "$section" in
                  enable)             echo ""; echo "启用的包:" ;;
                  disable)            echo ""; echo "禁用的包:" ;;
                  disable_components) echo ""; echo "禁用的子组件:" ;;
                  *) section="" ;;
                esac
                continue
              fi

              # 段内条目一律 "- 名称" 形式，其余行忽略
              printf '%s' "$line" | grep -qE '^[[:space:]]*- ' || continue
              item=$(printf '%s' "$line" | sed 's/^[[:space:]]*- //' | sed 's/#.*//' | xargs)
              [ -n "$item" ] || continue

              case "$section" in
                enable)
                  echo "CONFIG_PACKAGE_${item}=y" >> immortalwrt/.config
                  echo "  + ${item}"
                  ;;
                disable)
                  echo "# CONFIG_PACKAGE_${item} is not set" >> immortalwrt/.config
                  echo "  - ${item}"
                  ;;
                disable_components)
                  [ -n "$current_pkg" ] || continue
                  echo "# CONFIG_PACKAGE_${current_pkg}_${item} is not set" >> immortalwrt/.config
                  echo "  - ${current_pkg}_${item}"
                  ;;
              esac
            done < "$PACKAGES_FILE"
          else
            echo "[INFO] 无 packages 配置文件，跳过"
          fi

          # CONFIG_CCACHE 的可见性依赖 CONFIG_DEVEL，二者必须同时写入；
          # CCACHE_DIR 留空即沿用 $(TOPDIR)/.ccache。
          if [ "${{ inputs.cache_enabled }}" = "true" ]; then
            echo ""
            echo "[缓存] 写入 ccache 配置:"
            {
              echo "CONFIG_DEVEL=y"
              echo "CONFIG_CCACHE=y"
              echo "CONFIG_CCACHE_DIR=\"\""
            } >> immortalwrt/.config
            echo "  + CONFIG_DEVEL=y"
            echo "  + CONFIG_CCACHE=y"
            echo "  + CONFIG_CCACHE_DIR=(默认 \$(TOPDIR)/.ccache)"
          fi

          echo ""
          echo "[OK] 配置文件已生成"
          echo "=========================================="

      # skip_compile 时不编译，缓存只会是空目录；actions/cache 主键命中后不再保存，
      # 空缓存占住主键会使后续正常构建永远恢复空缓存——调试模式必须整体跳过缓存。
      - name: "[3.4] 恢复 ccache 缓存"
        if: ${{ inputs.cache_enabled && !inputs.skip_compile }}
        uses: actions/cache@v4
        with:
          path: immortalwrt/.ccache
          key: ccache-${{ runner.os }}-${{ steps.device.outputs.platform }}-${{ steps.version.outputs.tag }}-cc2
          restore-keys: |
            ccache-${{ runner.os }}-${{ steps.device.outputs.platform }}-

      - name: "[3.5] 恢复源码下载缓存 (dl)"
        # 同上：调试模式不下载源码，空 dl 缓存同样会占住主键。
        if: ${{ inputs.cache_enabled && !inputs.skip_compile }}
        uses: actions/cache@v4
        with:
          path: immortalwrt/dl
          key: dl-${{ runner.os }}-${{ steps.device.outputs.platform }}-${{ steps.version.outputs.tag }}

      # ccache 默认按编译器二进制的 mtime 校验，CI 每次重建工具链后缓存会全部失效。
      # 改为按编译器内容校验（content），效果等同官方 CI 的 string:<工具链 SHA>。
      # 必须在 [3.4] 恢复之后写入；改校验方式时同步递增缓存键末尾的 -cc2。
      - name: "[3.5.1] 配置 ccache 校验方式"
        if: ${{ inputs.cache_enabled && !inputs.skip_compile }}
        run: |
          mkdir -p immortalwrt/.ccache
          cat > immortalwrt/.ccache/ccache.conf <<'EOF'
          # 本文件由 FullBuild.yml [3.5.1] 每次运行重写
          # 按编译器内容而非 mtime 校验：CI 每次重建工具链，mtime 必然变化
          compiler_check = content
          # 从依赖文件推导实际用到的头文件
          depend_mode = true
          # 放宽无法稳定复现的哈希项（时间宏、源文件时间戳等）
          sloppiness = file_macro,locale,time_macros,include_file_ctime,include_file_mtime
          max_size = 5G
          EOF
          echo "[缓存] ccache 配置:"
          cat immortalwrt/.ccache/ccache.conf

      # ruby_yjit=false：defconfig 之前改 Makefile 默认值并在 .config 显式禁用，
      # 避免依赖解析拉入 Rust/LLVM 工具链（实测 ruby+rust 约占 77% 编译时间）。
      - name: "[3.5.2] 配置 ruby YJIT"
        run: |
          if [ "${{ inputs.ruby_yjit }}" = "false" ]; then
            RUBY_MK="immortalwrt/feeds/packages/lang/ruby/Makefile"
            if [ -f "$RUBY_MK" ]; then
              awk '/config RUBY_ENABLE_YJIT/{f=1} f&&/default y/{sub(/default y/,"default n");f=0} {print}' "$RUBY_MK" > "$RUBY_MK.tmp" && mv "$RUBY_MK.tmp" "$RUBY_MK"
              echo "[OK] RUBY_ENABLE_YJIT 默认值已改为 n:"
              grep -A6 'config RUBY_ENABLE_YJIT' "$RUBY_MK" | grep -E 'config RUBY|default' | sed 's|^|  |'
            else
              echo "[WARN] 未找到 $RUBY_MK，仅在 .config 中禁用"
            fi
            echo "# CONFIG_RUBY_ENABLE_YJIT is not set" >> immortalwrt/.config
            echo "[OK] 已禁用 ruby YJIT（不再拉入 Rust/LLVM 工具链）"
          else
            echo "[INFO] ruby YJIT 保持启用（需要 Rust/LLVM 工具链，约 60-130 分钟）"
          fi

      - name: "[3.6] 同步配置 (defconfig)"
        working-directory: immortalwrt
        run: make defconfig

      - name: "[3.7] 修复 Rust LLVM CI 下载"
        run: |
          RUST_MAKEFILE="immortalwrt/feeds/packages/lang/rust/Makefile"
          if [ -f "$RUST_MAKEFILE" ]; then
            sed -i 's/--set=llvm\.download-ci-llvm=true/--set=llvm.download-ci-llvm=false/' "$RUST_MAKEFILE"
            echo "[OK] 已禁用 download-ci-llvm"
            grep 'download-ci-llvm' "$RUST_MAKEFILE"
          else
            echo "[WARN] Rust Makefile 不存在: $RUST_MAKEFILE"
          fi

      # 阶段 4: 编译固件

      - name: "[4.1] 预下载资源"
        if: ${{ !inputs.skip_compile }}
        working-directory: immortalwrt
        run: |
          echo "多线程下载: -j$(nproc)"
          make download -j$(nproc) || {
            echo "[WARN] make download 未完全成功，检查 dl 目录是否已有足够源码包"
            ls dl 2>/dev/null | wc -l
          }

      - name: "[4.2] 编译固件"
        if: ${{ !inputs.skip_compile }}
        id: compile
        working-directory: immortalwrt
        run: |
          echo "=========================================="
          echo "  编译固件"
          echo "=========================================="

          # 仅支持整机编译：kmod 依赖 $(LINUX_DIR)/.config，需先完成 tools/toolchain/target，
          # 单包快速编译只会得到误导性的失败。
          echo "多线程编译: -j$(nproc)"

          # 三级重试：多线程 -> 单线程 -> V=s；输出必须 tee 到日志，否则失败时无据可查。
          BUILD_LOG="$RUNNER_TEMP/build.log"
          set +e
          make -j"$(nproc)" 2>&1 | tee "$BUILD_LOG"
          build_rc=${PIPESTATUS[0]}
          if [ "$build_rc" -eq 0 ]; then
            echo "[OK] 编译成功（多线程）"
          else
            echo "[WARN] 多线程编译失败（退出码 $build_rc），降级单线程重试"
            make -j1 2>&1 | tee "$BUILD_LOG"
            build_rc=${PIPESTATUS[0]}
            if [ "$build_rc" -eq 0 ]; then
              echo "[OK] 编译成功（单线程重试）"
            else
              echo "[ERROR] 多线程与单线程均失败（退出码 $build_rc），失败日志末尾:"
              tail -n 200 "$BUILD_LOG" || true
              echo "[ERROR] 以下为 V=s 详细日志（仅保留末尾 200 行）"
              make -j1 V=s 2>&1 | tee "$BUILD_LOG" | tail -n 200
              echo "::error::固件编译失败，详见上方 V=s 日志"
              exit 1
            fi
          fi
          set -e

          # 必须用 OpenWrt 自编译的 ccache 并显式指定 CCACHE_DIR，
          # 否则读空的 ~/.ccache 恒显示 0.00%；统计为累计值，需对比多次运行。
          if [ "${{ inputs.cache_enabled }}" = "true" ] && [ -x staging_dir/host/bin/ccache ]; then
            echo ""
            echo "[缓存] ccache 统计（累计）:"
            CCACHE_DIR="$PWD/.ccache" staging_dir/host/bin/ccache -s || true
            if [ -d .ccache ]; then
              echo "[缓存] .ccache 体积: $(du -sh .ccache 2>/dev/null | cut -f1)"
            else
              echo "[WARN] 未发现 .ccache 目录，ccache 可能未生效"
            fi
          fi

          echo "status=success" >> $GITHUB_OUTPUT

      - name: "[4.3] 编译后磁盘使用"
        if: ${{ !inputs.skip_compile && !cancelled() }}
        run: |
          echo "=========================================="
          echo "  编译后磁盘使用"
          echo "=========================================="
          df -hT "$GITHUB_WORKSPACE" | awk 'NR==2 {printf "  可用: %s / %s (%s 已用)\n", $4, $2, $5}'
          echo "=========================================="
          echo ""
          echo "=========================================="
          echo "  构建目录体积（评估磁盘占用与缓存策略用）"
          echo "=========================================="
          for d in immortalwrt/staging_dir immortalwrt/build_dir immortalwrt/dl immortalwrt/.ccache; do
            if [ -d "$d" ]; then
              printf "  %-24s %-8s (%s 个文件)\n" "$d" "$(du -sh "$d" 2>/dev/null | cut -f1)" "$(find "$d" -type f 2>/dev/null | wc -l)"
            else
              printf "  %-24s %s\n" "$d" "(不存在)"
            fi
          done
          echo "=========================================="

      # 阶段 5: 上传固件

      - name: "[5.1] 整理固件"
        id: organize
        # 条件中出现状态检查函数后，GitHub 不再附加隐式 success()；
        # 显式写上，避免 [4.2] 失败后仍执行并报找不到 bin 目录。
        if: ${{ !inputs.skip_compile && !cancelled() && success() && steps.compile.outputs.status == 'success' }}
        run: |
          MODEL="${{ steps.device.outputs.model }}"
          VERSION="${{ steps.version.outputs.tag }}"
          VERSION_RAW="${VERSION#v}"
          # 设备标识：去空格，仅用于 Artifact 名称；固件文件名保留型号空格
          DEVICE_ID=$(printf '%s' "$MODEL" | tr -cd 'A-Za-z0-9._-')
          # 构建号取源码树 version（make 生成），取不到回退版本标签
          BUILD_ID=""
          if [ -f immortalwrt/version ]; then
            BUILD_ID=$(head -1 immortalwrt/version 2>/dev/null | tr -d '[:space:]' || true)
          fi
          # 文件名只保留安全字符
          BUILD_ID=$(printf '%s' "$BUILD_ID" | tr -cd 'A-Za-z0-9._+-')
          if [ -z "$BUILD_ID" ]; then
            echo "[WARN] 未取到构建号，回退为版本标签: $VERSION"
            BUILD_ID="$VERSION"
          fi
          echo "[INFO] 构建号: $BUILD_ID"
          # 产物根目录：全量编译输出在源码树 immortalwrt/bin/ 下
          BUILD_ROOT="immortalwrt"
          BIN_ROOT="$BUILD_ROOT/bin"
          # 编译时间前缀 YYYYMMDD-HHMM（TZ=Asia/Shanghai），便于按编译先后排序
          DATE_STR=$(date +%Y%m%d-%H%M)
          STAGE_DIR="$GITHUB_WORKSPACE/firmware"
          mkdir -p "$STAGE_DIR"

          echo "=========================================="
          echo "  查找固件文件"
          echo "=========================================="

          # CONFIG_TARGET_mediatek_filogic_DEVICE_xxx -> mediatek/filogic
          DEVICE_TARGET="${{ steps.device.outputs.target }}"
          TARGET_PART=$(echo "$DEVICE_TARGET" | sed 's/CONFIG_TARGET_//' | sed 's/_DEVICE_.*//')
          PLATFORM_PATH=$(echo "$TARGET_PART" | sed 's/_/\//g')
          ARTIFACT_DIR="$BIN_ROOT/targets/${PLATFORM_PATH}"
          echo "[INFO] 从 TARGET 推断产物目录: ${ARTIFACT_DIR}"

          # 查找固件文件
          if [ -n "$ARTIFACT_DIR" ] && [ -d "$ARTIFACT_DIR" ]; then
            FW_FILES=$(find "$ARTIFACT_DIR" -maxdepth 1 -type f \( -name "*.itb" -o -name "*.bin" -o -name "*.img.gz" -o -name "*.squashfs" \) 2>/dev/null | grep -E "(sysupgrade|recovery|factory)" || true)
          else
            # 搜索整个 targets 目录
            FW_FILES=$(find $BIN_ROOT/targets -type f \( -name "*.itb" -o -name "*.bin" -o -name "*.img.gz" -o -name "*.squashfs" \) 2>/dev/null | grep -E "(sysupgrade|recovery|factory)" || true)
            if [ -z "$FW_FILES" ]; then
              # 回退：用第一个 sysupgrade 产物推断目录
              ARTIFACT_DIR=$(dirname "$(find $BIN_ROOT/targets -type f -name "*sysupgrade*" 2>/dev/null | head -1)" 2>/dev/null || true)
              echo "[WARN] 回退推断产物目录: ${ARTIFACT_DIR}"
            fi
          fi

          if [ -z "$FW_FILES" ]; then
            echo "[ERROR] 未找到固件文件"
            echo "期望目录: ${ARTIFACT_DIR}"
            echo "目录结构:"
            find $BIN_ROOT/targets -type f 2>/dev/null | head -20
            exit 1
          fi

          echo "$FW_FILES" | while read -r file; do
            [ -z "$file" ] && continue
            base=$(basename "$file")
            ext="${base##*.}"
            case "$base" in
              *squashfs-sysupgrade*) suffix="squashfs-sysupgrade" ;;
              *squashfs-factory*)    suffix="squashfs-factory" ;;
              *initramfs-recovery*)  suffix="initramfs-recovery" ;;
              *sysupgrade*)          suffix="sysupgrade" ;;
              *recovery*)            suffix="recovery" ;;
              *factory*)             suffix="factory" ;;
              *) suffix="${base%.*}" ;;
            esac
            # 命名：编译时间-型号-ImmortalWrt-V版本-构建号-类型.扩展名
            new_name="${DATE_STR}-${MODEL}-ImmortalWrt-V${VERSION_RAW}-${BUILD_ID}-${suffix}.${ext}"
            cp "$file" "$STAGE_DIR/$new_name"
            echo "[FILE] $base -> $new_name"
          done
          echo "[OK] 共处理 $(printf '%s\n' "$FW_FILES" | grep -c . || true) 个固件"

          # 复制配置文件（与固件命名规则一致；[5.4] 要求该文件必须存在）
          CP_NAME="${DATE_STR}-${MODEL}-ImmortalWrt-V${VERSION_RAW}-${BUILD_ID}-config.config"
          cp immortalwrt/.config "$STAGE_DIR/$CP_NAME"
          echo "[FILE] .config -> $CP_NAME"

          # 本平台产物目录：打印清单与健全性校验
          if [ -n "$ARTIFACT_DIR" ] && [ -d "$ARTIFACT_DIR" ]; then
            echo "[OK] 本平台产物目录: ${ARTIFACT_DIR}"
            echo "产物清单:"
            find "$ARTIFACT_DIR" -maxdepth 1 -type f | sed 's|^|  |' | head -40
            # 包后缀随版本变化（v25.12.x 为 .apk，v24.10.x 为 .ipk）
            echo "安装包数量 (*.apk/*.ipk): $(find "$ARTIFACT_DIR/packages" -type f \( -name '*.apk' -o -name '*.ipk' \) 2>/dev/null | wc -l)"
          else
            echo "[WARN] 本平台产物目录不存在，跳过清单打印: ${ARTIFACT_DIR}"
          fi

          # 整个 bin 输出目录：供 5.5 整体上传，必须存在
          if [ -d "$BIN_ROOT" ]; then
            echo "[OK] bin 输出目录: $BIN_ROOT"
            echo "bin 顶层内容:"
            ls -1 "$BIN_ROOT" | sed 's|^|  |'
            echo "bin 文件总数: $(find "$BIN_ROOT" -type f 2>/dev/null | wc -l)"
            echo "bin 总体积: $(du -sh "$BIN_ROOT" 2>/dev/null | cut -f1)"
          else
            echo "[ERROR] bin 输出目录不存在，无法上传完整产物: $BIN_ROOT"
            exit 1
          fi

          echo ""
          echo "[OK] 固件整理完成"
          echo "=========================================="

          echo "FIRMWARE=$STAGE_DIR" >> $GITHUB_ENV
          echo "BIN_DIR=$BIN_ROOT" >> $GITHUB_ENV
          echo "device_id=${DEVICE_ID}" >> $GITHUB_OUTPUT
          # 供 5.2-5.5 的 Artifact 名称使用，与固件文件名前缀一致
          echo "date_str=${DATE_STR}" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT

      - name: "[5.2] 上传固件 (sysupgrade)"
        uses: actions/upload-artifact@v4
        if: ${{ !inputs.skip_compile && steps.organize.outputs.status == 'success' && !cancelled() }}
        with:
          name: "${{ steps.organize.outputs.date_str }}-ImmortalWrt-${{ steps.organize.outputs.device_id }}-${{ steps.version.outputs.tag }}-sysupgrade"
          path: ${{ env.FIRMWARE }}/*sysupgrade*
          if-no-files-found: error
          retention-days: 90

      # 不使用 *{a,b}* 花括号；部分设备无 recovery/factory 产物，故用 warn。
      - name: "[5.3] 上传固件 (recovery/factory)"
        uses: actions/upload-artifact@v4
        if: ${{ !inputs.skip_compile && steps.organize.outputs.status == 'success' && !cancelled() }}
        with:
          name: "${{ steps.organize.outputs.date_str }}-ImmortalWrt-${{ steps.organize.outputs.device_id }}-${{ steps.version.outputs.tag }}-recovery"
          path: |
            ${{ env.FIRMWARE }}/*recovery*
            ${{ env.FIRMWARE }}/*factory*
          if-no-files-found: warn
          retention-days: 90

      - name: "[5.4] 上传配置文件"
        uses: actions/upload-artifact@v4
        if: ${{ !inputs.skip_compile && steps.organize.outputs.status == 'success' && !cancelled() }}
        with:
          name: "${{ steps.organize.outputs.date_str }}-ImmortalWrt-${{ steps.organize.outputs.device_id }}-${{ steps.version.outputs.tag }}-config"
          path: ${{ env.FIRMWARE }}/*.config
          if-no-files-found: error
          retention-days: 90

      # 上传整个 bin/：targets 下含固件、内核、dtb、profiles.json、sha256sums、manifest，
      # packages 下含全部安装包（.apk 或 .ipk，随版本）。隐藏文件默认跳过，故显式包含
      # （需 upload-artifact v4.4.0+，@v4 已满足）。
      - name: "[5.5] 上传完整编译产物"
        uses: actions/upload-artifact@v4
        if: ${{ !inputs.skip_compile && steps.organize.outputs.status == 'success' && !cancelled() }}
        with:
          name: "${{ steps.organize.outputs.date_str }}-ImmortalWrt-${{ steps.organize.outputs.device_id }}-${{ steps.version.outputs.tag }}-full"
          path: ${{ env.BIN_DIR }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      # 构建树缓存及其时间戳重置/裁剪步骤已整体移除（体积超配额且曾误删 core.h）；
      # 每次从零编译，加速由 ccache 承担。详见 README。
