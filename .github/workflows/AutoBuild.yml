#
# AutoBuild ImmortalWrt
# 仓库：https://github.com/lmwm/AutoBuild-ImmortalWrt
#
# 编译工作流，通过 device 参数选择设备
# 设备参数从 Devices/<设备名>/Device.yaml 读取
# 自定义包从 Devices/<设备名>/Packages.yaml 读取
# 自定义包脚本 Devices/<设备名>/Packages.sh
# 设备定制从 Devices/<设备名>/Customize.sh 执行
# 版本标签为下拉选择，选项由「同步版本标签」（SyncVersions.yml）工作流定期维护
#

name: "编译 ImmortalWrt 固件"

on:
  workflow_dispatch:
    inputs:
      device:
        description: "目标设备"
        type: choice
        options:
          - "Cudy TR3000"
        default: "Cudy TR3000"
        required: true
      tag:
        description: "ImmortalWrt 版本标签"
        type: choice
        options:
          - latest
          - "v25.12.2"
          - "v25.12.1"
          - "v25.12.0"
          - "v24.10.6"
        default: latest
        required: true
      cache_enabled:
        description: "启用编译缓存"
        type: boolean
        default: true
      skip_compile:
        description: "跳过编译（调试模式）"
        type: boolean
        default: false
      build_mode:
        description: "构建方式：full=全量编译（可改内核/DTS）；imagebuilder=官方 ImageBuilder 快速组装（分钟级，设备信息用 FILES= 覆盖）"
        type: choice
        options:
          - full
          - imagebuilder
        default: full
        required: true
      ruby_yjit:
        description: "启用 ruby YJIT（仅 full 模式有效；关闭可甩掉整个 Rust/LLVM 工具链，省 60-130 分钟）"
        type: boolean
        default: true

env:
  TZ: Asia/Shanghai

jobs:
  # ============================================================
  # 固件编译
  # ============================================================
  build:
    runs-on: ubuntu-latest
    name: "编译固件"
    timeout-minutes: 360

    steps:
      # ===========================================================
      # 阶段 1: 系统环境初始化
      # ===========================================================

      # ----------------------------------------------------------
      # 1.1 系统信息
      # ----------------------------------------------------------
      - name: "[1.1] 系统信息"
        run: |
          echo "=========================================="
          echo "  系统信息"
          echo "=========================================="
          echo ""

          # 系统版本
          echo "[系统]"
          echo "  OS: $(cat /etc/os-release | grep PRETTY_NAME | cut -d= -f2 | tr -d '"')"
          echo "  Kernel: $(uname -r)"
          echo "  Arch: $(uname -m)"
          echo ""

          # CPU 信息
          echo "[CPU]"
          CPU_MODEL=$(grep "model name" /proc/cpuinfo 2>/dev/null | head -1 | cut -d: -f2 | xargs)
          CPU_CORES=$(nproc 2>/dev/null || echo "未知")
          echo "  型号: ${CPU_MODEL:-未知}"
          echo "  核心: ${CPU_CORES} 核"
          echo ""

          # 内存信息
          echo "[内存]"
          free -h | awk '/^Mem:/ {printf "  总量: %s\n  已用: %s\n  可用: %s\n", $2, $3, $7}'
          echo ""

          # 磁盘信息
          echo "[磁盘]"
          echo "  工作目录: $GITHUB_WORKSPACE"
          df -hT "$GITHUB_WORKSPACE" | awk 'NR==2 {printf "  文件系统: %s\n  总量: %s\n  已用: %s (%s)\n  可用: %s\n", $1, $2, $3, $5, $4}'
          echo ""

          echo "=========================================="

      # ----------------------------------------------------------
      # 1.2 克隆配置仓库
      # ----------------------------------------------------------
      - name: "[1.2] 克隆配置仓库"
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 1.3 加载设备配置
      # ----------------------------------------------------------
      - name: "[1.3] 加载设备配置"
        id: device
        run: |
          DEVICE="${{ inputs.device }}"
          # 下拉选项值即目录名（含空格，如 "Cudy TR3000"）
          DEVICE_DIR="Devices/${DEVICE}"
          CONF="${DEVICE_DIR}/Device.yaml"

          if [ ! -f "$CONF" ]; then
            echo "::error::设备配置不存在: $CONF"
            exit 1
          fi

          # 解析 YAML 配置（键名首字母大写；用 sed 而非 awk，避免带空格的值被截断）
          DEVICE_MODEL=$(grep '^Model:' "$CONF" | sed 's/^Model: *//' | tr -d '"' | tr -d "'")
          PACKAGES_LIST=$(grep '^Packages_list:' "$CONF" | sed 's/^Packages_list: *//' | tr -d '"' | tr -d "'")
          DEVICE_TARGET=$(grep '^Target:' "$CONF" | sed 's/^Target: *//' | tr -d '"' | tr -d "'")

          if [ -z "$DEVICE_MODEL" ] || [ -z "$DEVICE_TARGET" ]; then
            echo "::error::${CONF} 缺少 Model 或 Target 字段"
            exit 1
          fi

          # 从 TARGET 推导平台标识，用于缓存键隔离（不同平台的产物不可混用）
          # CONFIG_TARGET_mediatek_filogic_DEVICE_xxx=y -> mediatek-filogic
          PLATFORM_SLUG=""
          if [ -n "$DEVICE_TARGET" ]; then
            PLATFORM_SLUG=$(echo "$DEVICE_TARGET" \
              | sed 's/^CONFIG_TARGET_//' \
              | sed 's/_DEVICE_.*$//' \
              | sed 's/_/-/g')
          fi
          if [ -z "$PLATFORM_SLUG" ]; then
            echo "::error::无法从 target 解析平台标识: ${DEVICE_TARGET}"
            exit 1
          fi

          echo "device_dir=${DEVICE_DIR}" >> $GITHUB_OUTPUT
          echo "model=${DEVICE_MODEL}" >> $GITHUB_OUTPUT
          echo "packages_list=${PACKAGES_LIST}" >> $GITHUB_OUTPUT
          echo "target=${DEVICE_TARGET}" >> $GITHUB_OUTPUT
          echo "platform=${PLATFORM_SLUG}" >> $GITHUB_OUTPUT

          echo "=========================================="
          echo "  设备配置"
          echo "=========================================="
          echo "  设备: ${DEVICE}"
          echo "  设备目录: ${DEVICE_DIR}"
          echo "  型号: ${DEVICE_MODEL}"
          echo "  包列表: ${PACKAGES_LIST}"
          echo "  平台: ${PLATFORM_SLUG}"
          echo "  TARGET: ${DEVICE_TARGET}"
          echo "=========================================="

      # ===========================================================
      # 阶段 2: 源码准备
      # ===========================================================

      # ----------------------------------------------------------
      # 2.1 安装编译环境
      # ----------------------------------------------------------
      - name: "[2.1] 安装编译环境"
        run: |
          echo "=========================================="
          echo "  安装编译环境"
          echo "=========================================="

          sudo apt-get update -y
          sudo apt-get upgrade -y

          sudo apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man \
            intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev \
            libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev \
            libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip \
            p7zip-full patch pkgconf python3 python3-pip python3-ply \
            python3-docutils python3-pyelftools python3-setuptools qemu-utils \
            re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "[OK] 编译环境安装完成"
          echo "=========================================="

      # ----------------------------------------------------------
      # 2.2 获取并校验版本标签（实时，不使用硬编码列表）
      # ----------------------------------------------------------
      - name: "[2.2] 获取版本标签"
        run: |
          echo "=========================================="
          echo "  获取 ImmortalWrt 版本标签（实时）"
          echo "=========================================="

          UPSTREAM="https://github.com/immortalwrt/immortalwrt.git"

          # 分两步：先落盘再过滤，这样 $? 反映的是 git 自身的退出码，不会被管道掩盖
          for attempt in 1 2 3; do
            if git ls-remote --tags --sort=-v:refname "$UPSTREAM" > tags_raw.txt 2>/dev/null; then
              grep -oP 'refs/tags/\K[v0-9.]+$' tags_raw.txt > tags_all.txt || true
              if [ -s tags_all.txt ]; then
                echo "[OK] 标签获取成功（第 ${attempt} 次尝试）"
                break
              fi
            fi

            echo "[WARN] 获取标签失败，5 秒后重试（第 ${attempt}/3 次）"
            sleep 5
          done

          if [ ! -s tags_all.txt ]; then
            echo "::error::无法从上游获取版本标签，请稍后重试"
            exit 1
          fi

          # 去重（annotated tag 可能重复出现），保持上游的版本倒序
          awk '!seen[$0]++' tags_all.txt > tags.txt

          echo "[OK] 上游可用版本标签（最新在前）:"
          sed 's/^/  - /' tags.txt
          echo ""

      # ----------------------------------------------------------
      # 2.3 确定版本标签
      # ----------------------------------------------------------
      - name: "[2.3] 确定版本标签"
        id: version
        run: |
          INPUT_TAG="${{ inputs.tag }}"
          LATEST_TAG=$(head -1 tags.txt)

          echo "=========================================="
          echo "  确定 ImmortalWrt 版本"
          echo "=========================================="

          if [ "$INPUT_TAG" = "latest" ]; then
            TAG="$LATEST_TAG"
            echo "[OK] latest -> 最新版本: $TAG"
          else
            TAG="$INPUT_TAG"
            if ! grep -qxF "$TAG" tags.txt; then
              echo "::error::版本标签不存在: $TAG"
              echo "[ERROR] 上游当前可用标签:"
              sed 's/^/  - /' tags.txt
              exit 1
            fi
            echo "[OK] 使用指定版本: $TAG"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "  上游最新版本: ${LATEST_TAG}"

          echo "=========================================="

      # ----------------------------------------------------------
      # 2.4 克隆 ImmortalWrt 源码
      # ----------------------------------------------------------
      - name: "[2.4] 克隆 ImmortalWrt 源码"
        if: ${{ inputs.build_mode == 'full' }}
        run: |
          git clone -b ${{ steps.version.outputs.tag }} \
            --single-branch --filter=blob:none \
            https://github.com/immortalwrt/immortalwrt.git \
            /tmp/immortalwrt
          ln -sf /tmp/immortalwrt $GITHUB_WORKSPACE/immortalwrt

      # ----------------------------------------------------------
      # 2.5 更新 feeds
      # ----------------------------------------------------------
      - name: "[2.5] 更新 feeds"
        if: ${{ inputs.build_mode == 'full' }}
        working-directory: immortalwrt
        run: ./scripts/feeds update -a

      # ----------------------------------------------------------
      # 2.6 安装 feeds
      # ----------------------------------------------------------
      - name: "[2.6] 安装 feeds"
        if: ${{ inputs.build_mode == 'full' }}
        working-directory: immortalwrt
        run: ./scripts/feeds install -a

      # ----------------------------------------------------------
      # 2.7 重置源码时间戳（增量构建的前提）
      #
      # 背景：OpenWrt 的 make 依据「构建状态戳（stamp）与依赖文件的相对时间」
      #       决定是否跳过编译。每次 git clone 出来的源码时间戳都是"现在"，
      #       而缓存恢复出来的 stamp 时间戳必然比它旧，于是 make 认为全部
      #       需要重编——这正是只缓存 staging_dir 时 tools/toolchain 仍要
      #       重编 25 分钟、总耗时几乎不变的原因。
      #
      # 做法：在 clone/feeds 之后、Packages.sh/Customize.sh 之前，把源码树的
      #       时间戳统一改到过去（2020-01-01）。此后：
      #       - 已缓存的包：stamp 比源码新 -> make 跳过（增量）
      #       - Packages.sh / Customize.sh 改过的文件：时间戳是"现在" ->
      #         精准触发对应包（如 oaf、内核/DTS）重建
      #       - Packages.sh 中 git clone 的外部包：时间戳是"现在" -> 正常重建
      #         （数量少、体积小，代价可忽略）
      #
      # 注意：只碰源码树本身，排除 build_dir / staging_dir / dl / .ccache——
      #       它们的时间戳必须保持原样（缓存恢复出的新时间戳正是所需）。
      # ----------------------------------------------------------
      - name: "[2.7] 重置源码时间戳（增量构建）"
        if: ${{ inputs.build_mode == 'full' && inputs.cache_enabled }}
        run: |
          cd immortalwrt
          find . \
            -path ./build_dir -prune -o \
            -path ./staging_dir -prune -o \
            -path ./dl -prune -o \
            -path ./.ccache -prune -o \
            -type f -print0 | xargs -0 -r touch -d '2020-01-01 00:00:00'
          echo "[OK] 源码树时间戳已重置为 2020-01-01（已排除 build_dir/staging_dir/dl/.ccache）"

      # ===========================================================
      # 阶段 3: 自定义固件
      # ===========================================================

      # ----------------------------------------------------------
      # 3.1 添加自定义软件包（git clone 等）
      # ----------------------------------------------------------
      - name: "[3.1] 添加自定义软件包"
        if: ${{ inputs.build_mode == 'full' }}
        run: |
          DEVICE_DIR="${{ steps.device.outputs.device_dir }}"
          if [ -f "${DEVICE_DIR}/Packages.sh" ]; then
            chmod +x "${DEVICE_DIR}/Packages.sh"
            cd immortalwrt && bash "${GITHUB_WORKSPACE}/${DEVICE_DIR}/Packages.sh"
          else
            echo "[INFO] 无 Packages.sh，跳过"
          fi

      # ----------------------------------------------------------
      # 3.2 设备定制
      # ----------------------------------------------------------
      - name: "[3.2] 设备定制"
        if: ${{ inputs.build_mode == 'full' }}
        run: |
          DEVICE_DIR="${{ steps.device.outputs.device_dir }}"
          if [ -f "${DEVICE_DIR}/Customize.sh" ]; then
            chmod +x "${DEVICE_DIR}/Customize.sh"
            cd immortalwrt && bash "${GITHUB_WORKSPACE}/${DEVICE_DIR}/Customize.sh"
          else
            echo "[INFO] 无设备定制脚本，跳过"
          fi

      # ----------------------------------------------------------
      # 3.3 生成编译配置
      # ----------------------------------------------------------
      - name: "[3.3] 生成编译配置"
        run: |
          DEVICE_DIR="${{ steps.device.outputs.device_dir }}"
          PACKAGES_LIST="${{ steps.device.outputs.packages_list }}"
          DEVICE_TARGET="${{ steps.device.outputs.target }}"

          echo "=========================================="
          echo "  生成编译配置"
          echo "=========================================="

          # 创建初始配置：写入设备 TARGET
          # （ImageBuilder 模式下 immortalwrt 目录不存在，先建目录；
          #   此处生成的 .config 同时作为 PACKAGES 列表的载体，供 [IB.3] 提取）
          mkdir -p immortalwrt
          if [ -n "$DEVICE_TARGET" ]; then
            echo "$DEVICE_TARGET" > immortalwrt/.config
            echo "[OK] 设置设备 TARGET: $DEVICE_TARGET"
          else
            echo "[WARN] 未设置设备 TARGET，使用默认配置"
            touch immortalwrt/.config
          fi

          # 如果存在 Packages.yaml，解析启用和禁用的包
          if [ -n "$PACKAGES_LIST" ] && [ -f "${DEVICE_DIR}/${PACKAGES_LIST}" ]; then
            PACKAGES_FILE="${DEVICE_DIR}/${PACKAGES_LIST}"

            # 解析启用的包
            echo ""
            echo "启用的包:"
            in_enable=false
            while IFS= read -r line; do
              # 检测 enable: 段落
              if echo "$line" | grep -q "^enable:"; then
                in_enable=true
                continue
              fi
              # 检测 disable: 段落（结束 enable）
              if echo "$line" | grep -q "^disable:"; then
                in_enable=false
                continue
              fi
              # 处理 enable 段落的包
              if [ "$in_enable" = true ]; then
                pkg=$(echo "$line" | sed 's/^[[:space:]]*- //' | sed 's/#.*//' | xargs)
                if [ -n "$pkg" ]; then
                  echo "CONFIG_PACKAGE_${pkg}=y" >> immortalwrt/.config
                  echo "  + ${pkg}"
                fi
              fi
            done < "$PACKAGES_FILE"

            # 解析禁用的包
            echo ""
            echo "禁用的包:"
            in_disable=false
            while IFS= read -r line; do
              # 检测 disable: 段落
              if echo "$line" | grep -q "^disable:"; then
                in_disable=true
                continue
              fi
              # 检测 disable_components: 段落（结束 disable）
              if echo "$line" | grep -q "^disable_components:"; then
                in_disable=false
                continue
              fi
              # 处理 disable 段落的包
              if [ "$in_disable" = true ]; then
                pkg=$(echo "$line" | sed 's/^[[:space:]]*- //' | sed 's/#.*//' | xargs)
                if [ -n "$pkg" ]; then
                  echo "# CONFIG_PACKAGE_${pkg} is not set" >> immortalwrt/.config
                  echo "  - ${pkg}"
                fi
              fi
            done < "$PACKAGES_FILE"

            # 解析禁用的子组件
            echo ""
            echo "禁用的子组件:"
            in_components=false
            current_pkg=""
            while IFS= read -r line; do
              # 检测 disable_components: 段落
              if echo "$line" | grep -q "^disable_components:"; then
                in_components=true
                continue
              fi
              # 检测包名（如 luci-app-passwall:）
              if [ "$in_components" = true ] && echo "$line" | grep -qE "^[[:space:]]+[a-zA-Z].*:"; then
                current_pkg=$(echo "$line" | sed 's/^[[:space:]]*//' | sed 's/:.*//' | xargs)
                continue
              fi
              # 检测下一个顶级键（结束）
              if echo "$line" | grep -q "^[a-zA-Z]" && ! echo "$line" | grep -q "^disable_components:"; then
                in_components=false
                current_pkg=""
                continue
              fi
              # 处理子组件
              if [ "$in_components" = true ] && [ -n "$current_pkg" ]; then
                component=$(echo "$line" | sed 's/^[[:space:]]*- //' | sed 's/#.*//' | xargs)
                if [ -n "$component" ]; then
                  echo "# CONFIG_PACKAGE_${current_pkg}_${component} is not set" >> immortalwrt/.config
                  echo "  - ${current_pkg}_${component}"
                fi
              fi
            done < "$PACKAGES_FILE"
          else
            echo "[INFO] 无 packages 配置文件，跳过"
          fi

          # 启用 ccache（仅在启用缓存时生效）
          # 依据 config/Config-devel.in：CONFIG_CCACHE 的可见性依赖 CONFIG_DEVEL，
          # 因此两者必须同时写入，否则 make defconfig 会把 CCACHE 剔除。
          # CCACHE_DIR 留空，OpenWrt 默认使用 $(TOPDIR)/.ccache，与缓存路径一致。
          if [ "${{ inputs.cache_enabled }}" = "true" ]; then
            echo ""
            echo "[缓存] 写入 ccache 配置:"
            {
              echo "CONFIG_DEVEL=y"
              echo "CONFIG_CCACHE=y"
              echo "CONFIG_CCACHE_DIR=\"\""
            } >> immortalwrt/.config
            echo "  + CONFIG_DEVEL=y"
            echo "  + CONFIG_CCACHE=y"
            echo "  + CONFIG_CCACHE_DIR=(默认 \$(TOPDIR)/.ccache)"
          fi

          # 生成 PACKAGES 列表（供 ImageBuilder 模式 [IB.3] 的 make image 使用）
          grep '^CONFIG_PACKAGE_.*=y' immortalwrt/.config \
            | sed 's/^CONFIG_PACKAGE_//; s/=y$//' \
            | sort -u > packages_list.txt
          echo "[INFO] PACKAGES 列表: $(wc -l < packages_list.txt) 个包 -> packages_list.txt"

          echo ""
          echo "[OK] 配置文件已生成"
          echo "=========================================="

      # ----------------------------------------------------------
      # 3.4 恢复编译缓存（可选）
      #
      # ccache  : 缓存 C/C++ 编译产物，重复编译同一版本可大幅提速
      # dl      : 缓存源码包，避免每次重新下载，降低上游下载失败风险
      # 两者相互独立，分别用 cache_enabled 开关控制。
      #
      # 缓存隔离说明（避免缓存串味影响编译正确性）：
      #   - 两个缓存都带「平台」维度（如 mediatek-filogic）。不同平台/架构的编译
      #     产物不可混用，隔离后即使将来新增不同平台的设备也不会互相污染。
      #   - dl 额外带「版本」维度且不设跨版本 restore-keys。原因是 dl 目录里
      #     存的是未校验的压缩包，跨版本复用可能让某个包的源码与目标版本不匹配，
      #     进而报 hash 校验失败。宁可为每个版本各存一份，也不冒串味的风险。
      #   - ccache 保留跨版本 restore-keys。ccache 以预处理后的源码与编译命令行
      #     做哈希，版本变了自然全部失效（安全），命中不了只是没加速，不会出错。
      #   - ccache 主键末尾带 compiler_check 版本标记（当前 -cc2）。actions/cache
      #     在主键完全命中时不会再保存缓存：一旦改动 [3.5.1] 的校验方式，旧键
      #     恢复出来的条目会全部失效、新条目又存不下去，缓存会永远停在旧格式。
      #     因此每次改动校验方式都必须同步递增该后缀（cc3、cc4…）。
      #   - 注意：GitHub 单个缓存上限 10GB。dl 目录通常在数 GB 级，若日志提示
      #     缓存超限，编译不受影响，只是本次不保存 dl 缓存。
      # ----------------------------------------------------------

      # ----------------------------------------------------------
      # 3.3.1 恢复构建树缓存（build_dir + staging_dir）
      #
      # 两者必须一起缓存：
      #   staging_dir —— host 工具与交叉工具链的安装产物（tools/toolchain 的输出）
      #   build_dir   —— 各包的构建产物与「构建状态戳（stamp）」
      # 只缓存 staging_dir 是无效的：stamp 在 build_dir 里，make 看不到 stamp
      # 就会把 tools/toolchain 重新编译一遍（实测 25 分钟白费）。
      #
      # 增量构建的完整链路：[2.7] 把源码时间戳改旧 -> stamp 显得比源码新 ->
      # make 跳过已编译的包 -> 只重建 Packages.sh/Customize.sh 改动的包。
      #
      # 主键带 github.run_id：actions/cache 在主键完全命中时不会再保存，
      # 若沿用固定主键，新增的构建结果永远存不进去。带 run_id 后每次都以
      # 新主键保存，restore-keys 前缀匹配保证仍能复用上一次的缓存，
      # 旧条目由 GitHub 的 10GB 配额 LRU 自动淘汰。
      # ----------------------------------------------------------
      - name: "[3.3.1] 恢复构建树缓存 (build_dir + staging_dir)"
        id: cache-restore
        if: ${{ inputs.build_mode == 'full' && inputs.cache_enabled }}
        uses: actions/cache/restore@v4
        with:
          path: |
            immortalwrt/build_dir
            immortalwrt/staging_dir
          key: tree-${{ runner.os }}-${{ steps.device.outputs.platform }}-${{ steps.version.outputs.tag }}-v1-${{ github.run_id }}
          restore-keys: |
            tree-${{ runner.os }}-${{ steps.device.outputs.platform }}-${{ steps.version.outputs.tag }}-v1-

      # ----------------------------------------------------------
      # 3.4 恢复 ccache 缓存
      # ----------------------------------------------------------
      - name: "[3.4] 恢复 ccache 缓存"
        if: ${{ inputs.build_mode == 'full' && inputs.cache_enabled }}
        uses: actions/cache@v4
        with:
          path: immortalwrt/.ccache
          key: ccache-${{ runner.os }}-${{ steps.device.outputs.platform }}-${{ steps.version.outputs.tag }}-cc2
          restore-keys: |
            ccache-${{ runner.os }}-${{ steps.device.outputs.platform }}-

      - name: "[3.5] 恢复源码下载缓存 (dl)"
        if: ${{ inputs.build_mode == 'full' && inputs.cache_enabled }}
        uses: actions/cache@v4
        with:
          path: immortalwrt/dl
          key: dl-${{ runner.os }}-${{ steps.device.outputs.platform }}-${{ steps.version.outputs.tag }}

      # ----------------------------------------------------------
      # 3.5.1 ccache 校验方式与调优
      #
      # 背景：ccache 默认以「编译器二进制的 mtime + size」作为缓存校验依据
      #       （ccache 手册 compiler_check，默认值 mtime）。CI 每次运行都会
      #       重新编译交叉工具链，mtime 必然变化，于是恢复回来的缓存对
      #       ccache 而言「不是同一个编译器」，target 侧全部 miss ——
      #       表现为缓存显示已命中、编译时间却几乎没变。
      #
      # 上游记录：openwrt/openwrt 提交 39562875（build: do not set
      #       CCACHE_COMPILERCHECK）的说明指出，CI 必须额外写一份
      #       compiler_check，因为 "compiler mtimes would not match after
      #       restoring a cache archive"；官方 CI 用
      #       string:<工具链提交 SHA>，此处用 content（哈希编译器内容），
      #       效果等价且无需维护工具链 SHA。
      #
      # ImmortalWrt 核实（v25.12.2）：其 rules.mk 同样不设置
      #       CCACHE_COMPILERCHECK，全仓库无 CCACHE_CONFIGPATH 引用（因此
      #       $CCACHE_DIR/ccache.conf 会生效），打包的 ccache 为 4.12.1，
      #       下列配置项均受支持。另注意：ImmortalWrt 25.12 起内核走 clang，
      #       不要照搬官方 CI 的 compiler_type=gcc，交给 ccache 自动识别。
      #
      # 位置要求：必须在 [3.4] 恢复 ccache 缓存之后执行，否则写好的配置
      #       会被恢复出来的旧缓存覆盖。
      # ----------------------------------------------------------
      - name: "[3.5.1] 配置 ccache 校验方式"
        if: ${{ inputs.build_mode == 'full' && inputs.cache_enabled }}
        run: |
          mkdir -p immortalwrt/.ccache
          cat > immortalwrt/.ccache/ccache.conf <<'EOF'
          # 本文件由 AutoBuild.yml 的 [3.5.1] 每次运行重写，确保设置生效
          # 以编译器内容而非 mtime 校验：CI 每次重建工具链，mtime 必然变化
          compiler_check = content
          # 依赖模式：从依赖文件推导实际用到的头文件，提速并提高命中率
          depend_mode = true
          # 放宽无法稳定复现的哈希项（时间宏、源文件时间戳等）
          sloppiness = file_macro,locale,time_macros,include_file_ctime,include_file_mtime
          max_size = 5G
          EOF
          echo "[缓存] ccache 配置:"
          cat immortalwrt/.ccache/ccache.conf

      # ----------------------------------------------------------
      # 3.5.2 ruby YJIT 开关（可选禁用，仅 full 模式）
      #
      # 背景：ruby 的 RUBY_ENABLE_YJIT 默认为 y（aarch64/x86_64 适用），
      #       而 YJIT 是用 Rust 实现的 JIT 编译器，其构建依赖
      #       PKG_BUILD_DEPENDS: RUBY_ENABLE_YJIT:rust/host —— 会拉入整个
      #       Rust/LLVM 工具链。实测 ruby + rust 合计占编译时间约 77%
      #       （ruby 131 分钟 + rust 与其并行）。而 OpenClash 只用 ruby 跑
      #       订阅规则转换等一次性短脚本，JIT 加速没有收益。
      #
      # 做法（双保险，确保 make defconfig 不会把它重新打开）：
      #   1) 把 Makefile 中 RUBY_ENABLE_YJIT 的 default y 改为 default n
      #   2) 在 .config 显式写入 "# CONFIG_RUBY_ENABLE_YJIT is not set"
      #
      # 位置：必须在 [3.3] 生成 .config 之后、[3.6] defconfig 之前。
      #       依赖解析发生在 defconfig，晚于它就拦不住 rust/host 的拉入。
      # ----------------------------------------------------------
      - name: "[3.5.2] 配置 ruby YJIT"
        if: ${{ inputs.build_mode == 'full' }}
        run: |
          if [ "${{ inputs.ruby_yjit }}" = "false" ]; then
            RUBY_MK="immortalwrt/feeds/packages/lang/ruby/Makefile"
            if [ -f "$RUBY_MK" ]; then
              awk '/config RUBY_ENABLE_YJIT/{f=1} f&&/default y/{sub(/default y/,"default n");f=0} {print}' "$RUBY_MK" > "$RUBY_MK.tmp" && mv "$RUBY_MK.tmp" "$RUBY_MK"
              echo "[OK] RUBY_ENABLE_YJIT 默认值已改为 n:"
              grep -A6 'config RUBY_ENABLE_YJIT' "$RUBY_MK" | grep -E 'config RUBY|default' | sed 's|^|  |'
            else
              echo "[WARN] 未找到 $RUBY_MK，仅在 .config 中禁用"
            fi
            echo "# CONFIG_RUBY_ENABLE_YJIT is not set" >> immortalwrt/.config
            echo "[OK] 已禁用 ruby YJIT（不再拉入 Rust/LLVM 工具链）"
          else
            echo "[INFO] ruby YJIT 保持启用（需要 Rust/LLVM 工具链，约 60-130 分钟）"
          fi

      # ----------------------------------------------------------
      # 3.6 同步配置
      # ----------------------------------------------------------
      - name: "[3.6] 同步配置 (defconfig)"
        if: ${{ inputs.build_mode == 'full' }}
        working-directory: immortalwrt
        run: make defconfig

      # ----------------------------------------------------------
      # 3.7 修复 Rust LLVM 下载问题
      # ----------------------------------------------------------
      - name: "[3.7] 修复 Rust LLVM CI 下载"
        if: ${{ inputs.build_mode == 'full' }}
        run: |
          RUST_MAKEFILE="immortalwrt/feeds/packages/lang/rust/Makefile"
          if [ -f "$RUST_MAKEFILE" ]; then
            sed -i 's/--set=llvm\.download-ci-llvm=true/--set=llvm.download-ci-llvm=false/' "$RUST_MAKEFILE"
            echo "[OK] 已禁用 download-ci-llvm"
            grep 'download-ci-llvm' "$RUST_MAKEFILE"
          else
            echo "[WARN] Rust Makefile 不存在: $RUST_MAKEFILE"
          fi

      # ===========================================================
      # 阶段 4: 编译固件
      # ===========================================================

      # ----------------------------------------------------------
      # 4.1 预下载资源
      # ----------------------------------------------------------
      - name: "[4.1] 预下载资源"
        if: ${{ inputs.build_mode == 'full' && !inputs.skip_compile }}
        working-directory: immortalwrt
        run: |
          echo "多线程下载: -j$(nproc)"
          make download -j$(nproc) || {
            echo "[WARN] make download 未完全成功，检查 dl 目录是否已有足够源码包"
            ls dl 2>/dev/null | wc -l
          }

      # ----------------------------------------------------------
      # 4.2 编译固件
      # ----------------------------------------------------------
      - name: "[4.2] 编译固件"
        if: ${{ inputs.build_mode == 'full' && !inputs.skip_compile }}
        id: compile
        working-directory: immortalwrt
        run: |
          echo "=========================================="
          echo "  编译固件"
          echo "=========================================="

          # 说明：这里不提供「只编译单个包」的快速测试分支。
          #       内核模块（如 kmod-oaf）的 .built 目标依赖 $(LINUX_DIR)/.config
          #       （见 include/kernel.mk 的 KernelPackage/depends），
          #       必须先完成 tools -> toolchain -> target/linux 三个阶段。
          #       只编单个包绕不过这些前置，只会产生误导性的失败。
          echo "多线程编译: -j$(nproc)"

          # 优先多线程；失败后降级单线程重试，最后带详细日志重试
          if make -j$(nproc); then
            echo "[OK] 编译成功（多线程）"
          elif make -j1; then
            echo "[OK] 编译成功（单线程重试）"
          else
            echo "[ERROR] 多线程与单线程均失败，以下为详细日志"
            make -j1 V=s
            echo "::error::固件编译失败，详见上方 V=s 日志"
            exit 1
          fi

          # ccache 命中统计与缓存体积（仅在启用缓存时）
          #
          # 注意：这里必须用 OpenWrt 自己编译的 ccache
          #       （staging_dir/host/bin/ccache，版本与写入缓存的一致），
          #       并显式指定 CCACHE_DIR。rules.mk 中的 CCACHE_DIR 只在 make
          #       子进程内生效，直接执行 `ccache -s` 会去读默认的 ~/.ccache
          #       （空目录），从而永远显示 0.00%，掩盖真实命中率。
          #       统计值是累计值（含被恢复的历史数据），对比多次运行的
          #       hits/misses 变化即可算出差值。
          if [ "${{ inputs.cache_enabled }}" = "true" ] && [ -x staging_dir/host/bin/ccache ]; then
            echo ""
            echo "[缓存] ccache 统计（累计）:"
            CCACHE_DIR="$PWD/.ccache" staging_dir/host/bin/ccache -s || true
            if [ -d .ccache ]; then
              echo "[缓存] .ccache 体积: $(du -sh .ccache 2>/dev/null | cut -f1)"
            else
              echo "[WARN] 未发现 .ccache 目录，ccache 可能未生效"
            fi
          fi

          echo "status=success" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------
      # 4.3 编译后磁盘使用
      # ----------------------------------------------------------
      - name: "[4.3] 编译后磁盘使用"
        if: ${{ inputs.build_mode == 'full' && !inputs.skip_compile && !cancelled() }}
        run: |
          echo "=========================================="
          echo "  编译后磁盘使用"
          echo "=========================================="
          df -hT "$GITHUB_WORKSPACE" | awk 'NR==2 {printf "  可用: %s / %s (%s 已用)\n", $4, $2, $5}'
          echo "=========================================="
          echo ""
          echo "=========================================="
          echo "  构建目录体积（评估缓存策略用）"
          echo "=========================================="
          for d in immortalwrt/staging_dir immortalwrt/build_dir immortalwrt/dl immortalwrt/.ccache; do
            if [ -d "$d" ]; then
              printf "  %-24s %-8s (%s 个文件)\n" "$d" "$(du -sh "$d" 2>/dev/null | cut -f1)" "$(find "$d" -type f 2>/dev/null | wc -l)"
            else
              printf "  %-24s %s\n" "$d" "(不存在)"
            fi
          done
          echo "=========================================="

      # ===========================================================
      # 阶段 IB: ImageBuilder 快速构建（build_mode=imagebuilder）
      #
      # 与全量编译互斥。不编译内核/工具链，而是下载官方 ImageBuilder 与
      # SDK（与 tag 严格对应，保证包 ABI 一致）：
      #   [IB.1] 下载并解压 ImageBuilder 与 SDK
      #   [IB.2] 用 SDK 编译第三方包（OpenClash/argon/argon-config/
      #          harbor-file，均为 PKGARCH:=all 的脚本/主题包，无内核 ABI
      #          问题），产出 .apk 放入 ImageBuilder 的 packages/
      #   [IB.3] make image 组装固件；设备信息用 FILES= 目录覆盖（不改
      #          dtb，只覆盖用户态文件 + uci-defaults 运行时修正显示）
      #
      # 预期总耗时 10-15 分钟。输出目录与全量编译一致
      # （bin/targets/<平台>/），因此 [5.x] 上传可共用。
      # ===========================================================

      # ----------------------------------------------------------
      # IB.1 下载 ImageBuilder 与 SDK
      # ----------------------------------------------------------
      - name: "[IB.1] 下载 ImageBuilder 与 SDK"
        if: ${{ inputs.build_mode == 'imagebuilder' }}
        run: |
          VER="${{ steps.version.outputs.tag }}"
          VER_RAW="${VER#v}"
          DEVICE_TARGET="${{ steps.device.outputs.target }}"
          TARGET_PART=$(echo "$DEVICE_TARGET" | sed 's/CONFIG_TARGET_//' | sed 's/_DEVICE_.*//')
          PLATFORM_PATH=$(echo "$TARGET_PART" | sed 's/_/\//g')
          BASE_URL="https://downloads.immortalwrt.org/releases/${VER_RAW}/targets/${PLATFORM_PATH}"
          echo "[INFO] 下载源: $BASE_URL"

          IB_FILE=$(curl -fsSL "$BASE_URL/" | grep -oE 'immortalwrt-imagebuilder-[^"]+\.tar\.zst' | head -1)
          SDK_FILE=$(curl -fsSL "$BASE_URL/" | grep -oE 'immortalwrt-sdk-[^"]+\.tar\.zst' | head -1)
          if [ -z "$IB_FILE" ] || [ -z "$SDK_FILE" ]; then
            echo "[ERROR] 未在 $BASE_URL/ 找到 ImageBuilder 或 SDK（该 tag 可能未发布官方产物）"
            exit 1
          fi

          curl -fL -o "$IB_FILE" "$BASE_URL/$IB_FILE"
          curl -fL -o "$SDK_FILE" "$BASE_URL/$SDK_FILE"
          tar --zstd -xf "$IB_FILE"
          tar --zstd -xf "$SDK_FILE"
          mv immortalwrt-imagebuilder-* ib
          mv immortalwrt-sdk-* sdk
          echo "[OK] ImageBuilder: $IB_FILE"
          echo "[OK] SDK: $SDK_FILE"
          echo "PLATFORM_PATH=$PLATFORM_PATH" >> $GITHUB_ENV

      # ----------------------------------------------------------
      # IB.2 SDK 编译第三方包
      #
      # Packages.sh 依赖 $OPENWRT_DIR=pwd，SDK 的目录结构与源码树兼容，
      # 可直接复用。四个第三方包都是 PKGARCH:=all（脚本/主题），
      # 不涉及内核 ABI，编译只需一两分钟。
      # ----------------------------------------------------------
      - name: "[IB.2] SDK 编译第三方包"
        if: ${{ inputs.build_mode == 'imagebuilder' }}
        run: |
          DEVICE_DIR="${{ steps.device.outputs.device_dir }}"
          cd sdk
          cp "$DEVICE_DIR/Packages.sh" .
          bash Packages.sh
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          {
            echo "CONFIG_PACKAGE_luci-app-openclash=y"
            echo "CONFIG_PACKAGE_luci-theme-argon=y"
            echo "CONFIG_PACKAGE_luci-app-argon-config=y"
            echo "CONFIG_PACKAGE_luci-app-harbor-file=y"
          } > .config
          make defconfig
          make package/luci-app-openclash/compile -j"$(nproc)"
          make package/luci-theme-argon/compile -j"$(nproc)"
          make package/luci-app-argon-config/compile -j"$(nproc)"
          make package/luci-app-harbor-file/compile -j"$(nproc)"
          mkdir -p ../ib/packages
          find bin/packages -name '*.apk' -exec cp -v {} ../ib/packages/ \;
          echo "[OK] 第三方包产物:"
          ls -1 ../ib/packages/

      # ----------------------------------------------------------
      # IB.3 组装固件（make image）
      #
      # PACKAGES 列表由 [3.3] 从 Packages.yaml 生成（packages_list.txt）。
      # FILES= 指向 Devices/<设备>/files，内容在运行时覆盖用户态设备信息。
      # ----------------------------------------------------------
      - name: "[IB.3] 组装固件 (make image)"
        if: ${{ inputs.build_mode == 'imagebuilder' }}
        run: |
          DEVICE_DIR="${{ steps.device.outputs.device_dir }}"
          DEVICE_TARGET="${{ steps.device.outputs.target }}"
          PROFILE=$(echo "$DEVICE_TARGET" | sed 's/.*_DEVICE_//' | sed 's/=y$//')
          PACKAGES_LIST=$(tr '\n' ' ' < packages_list.txt)
          cd ib
          echo "[INFO] PROFILE=$PROFILE"
          echo "[INFO] PACKAGES=$PACKAGES_LIST"
          make image PROFILE="$PROFILE" PACKAGES="$PACKAGES_LIST" FILES="$DEVICE_DIR/files"
          echo "[OK] ImageBuilder 构建完成"
          find bin/targets -type f | head -20

      # ===========================================================
      # 阶段 5: 上传固件
      # ===========================================================

      # ----------------------------------------------------------
      # 5.1 整理固件
      #
      # 产出：
      #   STAGE_DIR    暂存目录，存放重命名后的固件与配置文件，供 5.2-5.4 分类上传
      #   BIN_DIR      整个 bin 输出目录，供 5.5 整体上传
      #   ARTIFACT_DIR 本平台产物目录，仅用于打印清单与健全性校验
      # ----------------------------------------------------------
      - name: "[5.1] 整理固件"
        id: organize
        if: ${{ !inputs.skip_compile && !cancelled() && (inputs.build_mode == 'imagebuilder' || steps.compile.outputs.status == 'success') }}
        run: |
          MODEL="${{ steps.device.outputs.model }}"
          VERSION="${{ steps.version.outputs.tag }}"
          VERSION_RAW="${VERSION#v}"
          # 设备标识：去掉空格，仅用于 Artifact 名称（下载的 zip 文件名不带空格）
          # 固件文件名保留型号原有空格（Cudy TR3000-...）
          DEVICE_ID=$(echo "$MODEL" | tr -d ' ' | tr -cd 'A-Za-z0-9._-')
          BUILD_ID=$(head -1 immortalwrt/version 2>/dev/null || echo "unknown")
          # 双模式产物根目录：full 模式在源码树，imagebuilder 模式在 ImageBuilder 目录
          if [ "${{ inputs.build_mode }}" = "imagebuilder" ]; then
            BUILD_ROOT="ib"
          else
            BUILD_ROOT="immortalwrt"
          fi
          BIN_ROOT="$BUILD_ROOT/bin"
          # 编译时刻（YYYYMMDD-HHMM），时区由 job 的 env.TZ 决定（当前 Asia/Shanghai）
          # 该前缀放在文件名最前，便于按编译先后排序
          DATE_STR=$(date +%Y%m%d-%H%M)
          STAGE_DIR="$GITHUB_WORKSPACE/firmware"
          mkdir -p "$STAGE_DIR"

          echo "=========================================="
          echo "  查找固件文件"
          echo "=========================================="

          # 从 TARGET 配置提取平台信息
          # CONFIG_TARGET_mediatek_filogic_DEVICE_xxx -> mediatek/filogic
          DEVICE_TARGET="${{ steps.device.outputs.target }}"
          if [ -n "$DEVICE_TARGET" ]; then
            # 提取 TARGET_mediatek_filogic 部分
            TARGET_PART=$(echo "$DEVICE_TARGET" | sed 's/CONFIG_TARGET_//' | sed 's/_DEVICE_.*//')
            # 将下划线转换为斜杠: mediatek_filogic -> mediatek/filogic
            PLATFORM_PATH=$(echo "$TARGET_PART" | sed 's/_/\//g')
            ARTIFACT_DIR="$BIN_ROOT/targets/${PLATFORM_PATH}"
            echo "[INFO] 从 TARGET 推断产物目录: ${ARTIFACT_DIR}"
          else
            ARTIFACT_DIR=""
            echo "[WARN] 未设置 TARGET，将搜索整个 targets 目录"
          fi

          # 查找固件文件
          if [ -n "$ARTIFACT_DIR" ] && [ -d "$ARTIFACT_DIR" ]; then
            # 精确查找指定目录
            FW_FILES=$(find "$ARTIFACT_DIR" -maxdepth 1 -type f \( -name "*.itb" -o -name "*.bin" -o -name "*.img.gz" -o -name "*.squashfs" \) 2>/dev/null | grep -E "(sysupgrade|recovery|factory)" || true)
          else
            # 搜索整个 targets 目录
            FW_FILES=$(find $BIN_ROOT/targets -type f \( -name "*.itb" -o -name "*.bin" -o -name "*.img.gz" -o -name "*.squashfs" \) 2>/dev/null | grep -E "(sysupgrade|recovery|factory)" || true)
            if [ -z "$FW_FILES" ]; then
              # 回退：用第一个 sysupgrade 产物推断目录
              ARTIFACT_DIR=$(dirname "$(find $BIN_ROOT/targets -type f -name "*sysupgrade*" 2>/dev/null | head -1)" 2>/dev/null || true)
              echo "[WARN] 回退推断产物目录: ${ARTIFACT_DIR}"
            fi
          fi

          if [ -z "$FW_FILES" ]; then
            echo "[ERROR] 未找到固件文件"
            echo "期望目录: ${ARTIFACT_DIR}"
            echo "目录结构:"
            find $BIN_ROOT/targets -type f 2>/dev/null | head -20
            exit 1
          fi

          echo "$FW_FILES" | while read -r file; do
            [ -z "$file" ] && continue
            base=$(basename "$file")
            ext="${base##*.}"
            case "$base" in
              *squashfs-sysupgrade*) suffix="squashfs-sysupgrade" ;;
              *squashfs-factory*)    suffix="squashfs-factory" ;;
              *initramfs-recovery*)  suffix="initramfs-recovery" ;;
              *sysupgrade*)          suffix="sysupgrade" ;;
              *recovery*)            suffix="recovery" ;;
              *factory*)             suffix="factory" ;;
              *) suffix="${base%.*}" ;;
            esac
            # 命名规则：编译时间在最前（YYYYMMDD-HHMM，便于排序），
            #           设备型号保留原有空格
            new_name="${DATE_STR}-${MODEL}-ImmortalWrt-V${VERSION_RAW}-${BUILD_ID}-${suffix}.${ext}"
            cp "$file" "$STAGE_DIR/$new_name"
            echo "[FILE] $base -> $new_name"
          done
          echo "[OK] 共处理 $(printf '%s\n' "$FW_FILES" | grep -c . || true) 个固件"

          # 复制配置文件（编译时间在最前，与固件命名规则保持一致）
          CP_NAME="${DATE_STR}-${MODEL}-ImmortalWrt-V${VERSION_RAW}-${BUILD_ID}-config.config"
          cp immortalwrt/.config "$STAGE_DIR/$CP_NAME"
          echo "[FILE] .config -> $CP_NAME"

          # 本平台产物目录：仅用于打印清单与健全性校验
          if [ -n "$ARTIFACT_DIR" ] && [ -d "$ARTIFACT_DIR" ]; then
            echo "[OK] 本平台产物目录: ${ARTIFACT_DIR}"
            echo "产物清单:"
            find "$ARTIFACT_DIR" -maxdepth 1 -type f | sed 's|^|  |' | head -40
            echo "APK 包数量: $(find "$ARTIFACT_DIR/packages" -name '*.apk' 2>/dev/null | wc -l)"
          else
            echo "[WARN] 本平台产物目录不存在，跳过清单打印: ${ARTIFACT_DIR}"
          fi

          # 整个 bin 输出目录：供 5.5 整体上传，必须存在
          if [ -d "$BIN_ROOT" ]; then
            echo "[OK] bin 输出目录: $BIN_ROOT"
            echo "bin 顶层内容:"
            ls -1 "$BIN_ROOT" | sed 's|^|  |'
            echo "bin 文件总数: $(find "$BIN_ROOT" -type f 2>/dev/null | wc -l)"
            echo "bin 总体积: $(du -sh "$BIN_ROOT" 2>/dev/null | cut -f1)"
          else
            echo "[ERROR] bin 输出目录不存在，无法上传完整产物: $BIN_ROOT"
            exit 1
          fi

          echo ""
          echo "[OK] 固件整理完成"
          echo "=========================================="

          echo "FIRMWARE=$STAGE_DIR" >> $GITHUB_ENV
          echo "BIN_DIR=$BIN_ROOT" >> $GITHUB_ENV
          echo "ARTIFACT_DIR=$ARTIFACT_DIR" >> $GITHUB_ENV
          echo "device_id=${DEVICE_ID}" >> $GITHUB_OUTPUT
          # 供 5.2-5.5 的 Artifact 名称使用，与固件文件名前缀保持一致
          echo "date_str=${DATE_STR}" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------
      # 5.2 上传固件 (sysupgrade)
      # ----------------------------------------------------------
      - name: "[5.2] 上传固件 (sysupgrade)"
        uses: actions/upload-artifact@v4
        if: ${{ !inputs.skip_compile && steps.organize.outputs.status == 'success' && !cancelled() }}
        with:
          name: "${{ steps.organize.outputs.date_str }}-ImmortalWrt-${{ steps.organize.outputs.device_id }}-${{ steps.version.outputs.tag }}-sysupgrade"
          path: ${{ env.FIRMWARE }}/*sysupgrade*
          if-no-files-found: error
          retention-days: 90

      # ----------------------------------------------------------
      # 5.3 上传固件 (recovery/factory)
      #
      # 注意：路径通配不使用 *{a,b}* 花括号展开，改用多行写法，语义更明确。
      # 部分设备没有 recovery/factory 产物，故用 warn 而不是 error。
      # ----------------------------------------------------------
      - name: "[5.3] 上传固件 (recovery/factory)"
        uses: actions/upload-artifact@v4
        if: ${{ !inputs.skip_compile && steps.organize.outputs.status == 'success' && !cancelled() }}
        with:
          name: "${{ steps.organize.outputs.date_str }}-ImmortalWrt-${{ steps.organize.outputs.device_id }}-${{ steps.version.outputs.tag }}-recovery"
          path: |
            ${{ env.FIRMWARE }}/*recovery*
            ${{ env.FIRMWARE }}/*factory*
          if-no-files-found: warn
          retention-days: 90

      # ----------------------------------------------------------
      # 5.4 上传配置文件
      # ----------------------------------------------------------
      - name: "[5.4] 上传配置文件"
        uses: actions/upload-artifact@v4
        if: ${{ !inputs.skip_compile && steps.organize.outputs.status == 'success' && !cancelled() }}
        with:
          name: "${{ steps.organize.outputs.date_str }}-ImmortalWrt-${{ steps.organize.outputs.device_id }}-${{ steps.version.outputs.tag }}-config"
          path: ${{ env.FIRMWARE }}/*.config
          if-no-files-found: error
          retention-days: 90

      # ----------------------------------------------------------
      # 5.5 上传完整编译产物
      #
      # 上传的是整个 bin 输出目录（immortalwrt/bin/）内的全部内容，
      # 而不是暂存目录里重命名过的那几个文件。包含：
      #   bin/targets/<平台>/   固件镜像、内核、设备树、
      #                         profiles.json、sha256sums、*.manifest
      #   bin/packages/<架构>/  编译出的全部 .apk 安装包
      # 注意：upload-artifact 默认跳过隐藏文件，这里显式包含。
      #       该参数需要 actions/upload-artifact v4.4.0+，@v4 已满足；
      #       若报 "Unexpected input(s) 'include-hidden-files'"，说明 runner
      #       用的 v4 版本过旧，可去掉该参数或改为显式列出文件。
      # ----------------------------------------------------------
      - name: "[5.5] 上传完整编译产物"
        uses: actions/upload-artifact@v4
        if: ${{ !inputs.skip_compile && steps.organize.outputs.status == 'success' && !cancelled() }}
        with:
          name: "${{ steps.organize.outputs.date_str }}-ImmortalWrt-${{ steps.organize.outputs.device_id }}-${{ steps.version.outputs.tag }}-full"
          path: ${{ env.BIN_DIR }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      # ----------------------------------------------------------
      # 5.6 裁剪构建树（缓存体积控制）
      #
      # build_dir 编译完成后约 43GB / 128 万文件，远超 GitHub 每仓库 10GB 的
      # 缓存配额，必须裁剪后再保存。裁剪是安全的：
      #   - 删除 *.o 等中间目标文件后，make 仍会因 stamp 存在而跳过编译
      #   - 万一某包需要重编，ccache 命中率 99.99%，可秒回这些 .o
      #   - 打包所需的 ipkg-* 产物目录与 stamp 一律保留
      # ----------------------------------------------------------
      - name: "[5.6] 裁剪构建树（缓存体积控制）"
        if: ${{ inputs.build_mode == 'full' && inputs.cache_enabled && !cancelled() }}
        run: |
          echo "[裁剪] 之前: build_dir $(du -sh immortalwrt/build_dir 2>/dev/null | cut -f1)"
          # 中间目标文件与依赖缓存（stamp 保证不会重编；需要时 ccache 秒回）
          find immortalwrt/build_dir -type f \( -name '*.o' -o -name '*.lo' -o -name '*.obj' -o -name '*.tmp' -o -name 'core.*' \) -delete 2>/dev/null || true
          find immortalwrt/build_dir -type d \( -name '.deps' -o -name '.tmp' \) -exec rm -rf {} + 2>/dev/null || true
          echo "[裁剪] 之后: build_dir $(du -sh immortalwrt/build_dir 2>/dev/null | cut -f1)"
          echo "[裁剪] 之后: staging_dir $(du -sh immortalwrt/staging_dir 2>/dev/null | cut -f1)"

      # ----------------------------------------------------------
      # 5.7 保存构建树缓存
      #
      # key 与 [3.3.1] 保持一致（含 github.run_id），因此每次运行都会以
      # 新主键保存；restore-keys 前缀匹配保证下次仍能复用本次结果。
      # 若体积超过 GitHub 缓存上限，此处会提示超限但不影响编译产物。
      # ----------------------------------------------------------
      - name: "[5.7] 保存构建树缓存"
        if: ${{ inputs.build_mode == 'full' && inputs.cache_enabled && !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: |
            immortalwrt/build_dir
            immortalwrt/staging_dir
          key: tree-${{ runner.os }}-${{ steps.device.outputs.platform }}-${{ steps.version.outputs.tag }}-v1-${{ github.run_id }}
