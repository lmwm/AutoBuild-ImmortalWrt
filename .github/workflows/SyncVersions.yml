#
# 同步版本标签：定时从上游拉取正式标签，改写 FullBuild.yml 的 tag 下拉选项。
#
# 每周一 03:00 UTC（北京时间 11:00）运行，也可手动触发；无变化不提交。
# 前置条件：配置 Secret「SYNC_TOKEN」（细粒度 PAT，Contents + Workflows 读写）。
# GitHub 禁止默认 GITHUB_TOKEN 修改 .github/workflows/ 下的文件，故必须用 PAT。
# 改写逻辑见 .github/scripts/SyncTags.py。
#

name: "同步版本标签"

on:
  schedule:
    # 每周一 03:00 UTC（北京时间 11:00）
    - cron: '0 3 * * 1'
  workflow_dispatch:

env:
  # 下拉列表中保留的历史版本数量
  KEEP_COUNT: 4

# 推送依赖 SYNC_TOKEN，这里只需读取权限
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    name: "同步版本标签"
    timeout-minutes: 15

    steps:
      # 用 SYNC_TOKEN clone，后续 push 才具备改 .github/workflows/ 的权限；
      # 未配置时回退 GITHUB_TOKEN（[4] 会给出配置指引）。
      - name: "[1] 克隆配置仓库"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: "[2] 获取上游版本标签"
        run: |
          echo "=========================================="
          echo "  获取 ImmortalWrt 版本标签"
          echo "=========================================="

          UPSTREAM="https://github.com/immortalwrt/immortalwrt.git"

          for attempt in 1 2 3; do
            if git ls-remote --tags --sort=-v:refname "$UPSTREAM" > tags_raw.txt 2>/dev/null; then
              # 只保留 v25.12.1 这类正式版本，排除 -rc / -beta 等预发布
              grep -oP 'refs/tags/\Kv[0-9.]+$' tags_raw.txt | awk '!seen[$0]++' > tags.txt || true
              if [ -s tags.txt ]; then
                echo "[OK] 标签获取成功（第 ${attempt} 次尝试）"
                break
              fi
            fi
            echo "[WARN] 获取标签失败，5 秒后重试（第 ${attempt}/3 次）"
            sleep 5
          done

          if [ ! -s tags.txt ]; then
            echo "::error::无法从上游获取版本标签"
            exit 1
          fi

          TOTAL=$(wc -l < tags.txt)
          echo "[OK] 上游共有 ${TOTAL} 个正式版本，最新在前:"
          sed 's/^/  - /' tags.txt | head -20

      - name: "[3] 更新编译工作流的下拉选项"
        run: |
          echo "=========================================="
          echo "  更新编译工作流选项（FullBuild）"
          echo "=========================================="

          for wf in FullBuild.yml; do
            echo ""
            echo "--- $wf ---"
            python3 .github/scripts/SyncTags.py \
              ".github/workflows/$wf" \
              tags.txt \
              "$KEEP_COUNT"
          done

          echo ""
          echo "更新后的选项预览:"
          for wf in FullBuild.yml; do
            echo "--- $wf ---"
            awk '/^      tag:/{f=1} f{print} f&&/^        default:/{exit}' ".github/workflows/$wf"
          done

      # SYNC_TOKEN 必须是细粒度 PAT（Contents + Workflows 读写）：
      # GitHub 禁止 GITHUB_TOKEN 修改 .github/workflows/ 下的文件，该限制无法绕过。
      - name: "[4] 提交变更"
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          echo "=========================================="
          echo "  提交变更"
          echo "=========================================="

          # 防呆守卫：public 仓库日志任何人可见，GitHub 只遮蔽原始 secret 值，
          # 拼接/编码后的派生值仍会泄露；检查目标用变量拼接，避免守卫命中自身。
          SCRIPT_PATH="$GITHUB_WORKSPACE/.github/workflows/SyncVersions.yml"
          K_ENV="e""nv"
          K_PE="print""env"
          V_TOK='$''SYNC_TOKEN'
          V_GHT='$''GITHUB_TOKEN'

          # 1) 关闭命令回显（即使有人为调试加了 set -x）
          set +x

          # 2) 静态检查所有 run 块（YAML 与 shell 的注释行跳过）
          if awk -v e="$K_ENV" -v pe="$K_PE" -v tok="$V_TOK" -v ght="$V_GHT" '
            /^[[:space:]]*run:[[:space:]]*\|/ { inrun=1; next }
            inrun && !/^[[:space:]]/        { inrun=0 }
            !inrun                          { next }
            { line=$0; sub(/^[[:space:]]*/, "", line); if (line ~ /^#/) next }
            /set[[:space:]]+-[a-zA-Z]*x/    { print "::error::检测到 set -x，会回显命令与环境变量"; bad=1 }
            /set[[:space:]]+-[a-zA-Z]*o[[:space:]]+xtrace/ { print "::error::检测到 set -o xtrace"; bad=1 }
            {
              if (index(line, e) > 0 && line !~ /^env:/) { print "::error::检测到裸 " e " 命令，会打印全部环境变量"; bad=1 }
              if (index(line, pe) > 0) { print "::error::检测到 " pe " 命令，会打印全部环境变量"; bad=1 }
              if (index(line, tok) > 0 || index(line, ght) > 0) { print "::error::检测到直接展开敏感变量"; bad=1 }
            }
            END { exit (bad ? 1 : 0) }
          ' "$SCRIPT_PATH"; then
            echo "[OK] 安全自检通过"
          else
            echo "::error::安全自检未通过，拒绝执行（本仓库为 public，运行日志公开可见）"
            echo "         请移除上述调试语句后重试"
            exit 1
          fi

          # 3) 确认 SYNC_TOKEN 已注入（只报长度，绝不回显内容）
          if [ -n "$SYNC_TOKEN" ]; then
            echo "[OK] 凭据已注入（长度 ${#SYNC_TOKEN}）"
          fi

          if git diff --quiet; then
            echo "[OK] 无变化，跳过提交"
            exit 0
          fi

          LATEST=$(head -1 tags.txt)

          # 未配置 PAT：给出明确指引，而不是无意义地失败
          if [ -z "$SYNC_TOKEN" ]; then
            # 当前只有 FullBuild.yml 一个编译工作流维护 tag.options
            CURRENT=$(awk '/^      tag:/{f=1} f{print} f&&/^        default:/{exit}' .github/workflows/FullBuild.yml \
              | grep '^          - ' | sed 's/^          - //' | tr -d '"' | tr '\n' ' ')
            DESIRED=$(printf 'latest %s' "$(head -n "$KEEP_COUNT" tags.txt | tr '\n' ' ')")

            echo ""
            echo "::error::未配置 SYNC_TOKEN，无法提交对工作流文件的修改"
            echo ""
            echo "【为什么需要】"
            echo "  GitHub 不允许默认 GITHUB_TOKEN 修改 .github/workflows/ 下的文件"
            echo "  （防止 Actions 自我提权），该限制无法通过仓库设置绕过。"
            echo ""
            echo "【配置步骤】"
            echo "  1. 打开 https://github.com/settings/personal-access-tokens/new"
            echo "  2. Repository access 仅选 AutoBuild-ImmortalWrt"
            echo "  3. Permissions 勾选："
            echo "       Contents  : Read and write"
            echo "       Workflows : Read and write"
            echo "  4. 生成后复制 token"
            echo "  5. 打开 https://github.com/lmwm/AutoBuild-ImmortalWrt/settings/secrets/actions"
            echo "  6. New repository secret，名称 SYNC_TOKEN，值粘贴 token"
            echo ""
            echo "【本次应更新的内容】"
            echo "  上游最新: ${LATEST}"
            echo "  当前选项: ${CURRENT}"
            echo "  期望选项: ${DESIRED}"
            echo ""
            echo "（配置 SYNC_TOKEN 后重跑本工作流即可自动完成）"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/FullBuild.yml
          git commit -m "配置: 同步 ImmortalWrt 版本标签（最新 ${LATEST}）"

          echo "[OK] 已提交，开始推送"
          for attempt in 1 2 3; do
            # 直接判断 git 的退出码：`git push | sed` 会把 sed 的退出码当结果。
            # 凭证来自 [1] checkout 注入的 SYNC_TOKEN，无需重复传递。
            if git push origin HEAD:main; then
              echo "[OK] 推送成功（第 ${attempt} 次尝试）"
              exit 0
            fi
            echo "[WARN] 推送失败，10 秒后重试（第 ${attempt}/3 次）"
            sleep 10
          done

          echo "::error::推送失败，已重试 3 次"
          exit 1
