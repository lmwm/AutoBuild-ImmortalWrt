#
# 同步版本标签
# 仓库：https://github.com/lmwm/AutoBuild-ImmortalWrt
#
# 目的：让 AutoBuild.yml 中 tag 的下拉选项保持最新，避免手动输入版本号出错。
#
# 背景：GitHub Actions 的 workflow_dispatch 下拉选项（type: choice）必须在
#       工作流文件中静态列出，官方不支持在运行时动态生成。因此这里用定时
#       工作流从上游拉取标签，自动改写 AutoBuild.yml 的 options。
#
# 行为：
#   - 每周一 03:00 UTC 自动运行，也可手动触发
#   - 拉取上游全部正式标签（排除 -rc 等预发布版本）
#   - 保留最新的 KEEP_COUNT 个，重新写入 AutoBuild.yml 的 tag.options
#   - 无变化则不做任何提交
#   - 有变化则用 SYNC_TOKEN 直接提交推送
#
# 前置条件：仓库需配置 Secret「SYNC_TOKEN」（细粒度 PAT）
#   GitHub 不允许默认 GITHUB_TOKEN 修改 .github/workflows/ 下的文件
#   （防止 Actions 自我提权），故此步骤必须使用 PAT。
#   权限：Contents 读写 + Workflows 读写。
#   未配置时工作流会在 [4] 步骤输出配置指引并失败，不会静默跳过。
#
# 实际改写逻辑见 .github/scripts/SyncTags.py
#
# 注意：GitHub 对长期无活动的仓库会停用定时工作流。本仓库会持续触发编译，
#       通常不会遇到；若发现下拉列表长期未更新，手动触发本工作流即可。
#

name: "同步版本标签"

on:
  schedule:
    # 每周一 03:00 UTC（北京时间 11:00）
    - cron: '0 3 * * 1'
  workflow_dispatch:

env:
  # 下拉列表中保留的历史版本数量
  KEEP_COUNT: 4

# 推送依赖 SYNC_TOKEN，这里只需读取权限
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    name: "同步版本标签"
    timeout-minutes: 15

    steps:
      # 使用 SYNC_TOKEN（细粒度 PAT）clone，使后续 push 具备改动
      # .github/workflows/ 下文件所需的 workflows 权限。
      # 未配置时回退为默认 GITHUB_TOKEN（此时 [4] 会给出配置指引）。
      - name: "[1] 克隆配置仓库"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: "[2] 获取上游版本标签"
        run: |
          echo "=========================================="
          echo "  获取 ImmortalWrt 版本标签"
          echo "=========================================="

          UPSTREAM="https://github.com/immortalwrt/immortalwrt.git"

          for attempt in 1 2 3; do
            if git ls-remote --tags --sort=-v:refname "$UPSTREAM" > tags_raw.txt 2>/dev/null; then
              # 只保留形如 v25.12.1 的正式版本，排除 -rc / -beta 等预发布
              grep -oP 'refs/tags/\Kv[0-9.]+$' tags_raw.txt | awk '!seen[$0]++' > tags.txt || true
              if [ -s tags.txt ]; then
                echo "[OK] 标签获取成功（第 ${attempt} 次尝试）"
                break
              fi
            fi
            echo "[WARN] 获取标签失败，5 秒后重试（第 ${attempt}/3 次）"
            sleep 5
          done

          if [ ! -s tags.txt ]; then
            echo "::error::无法从上游获取版本标签"
            exit 1
          fi

          TOTAL=$(wc -l < tags.txt)
          echo "[OK] 上游共有 ${TOTAL} 个正式版本，最新在前:"
          sed 's/^/  - /' tags.txt | head -20

      - name: "[3] 更新 AutoBuild.yml 的下拉选项"
        run: |
          echo "=========================================="
          echo "  更新 AutoBuild.yml 选项"
          echo "=========================================="

          python3 .github/scripts/SyncTags.py \
            .github/workflows/AutoBuild.yml \
            tags.txt \
            "$KEEP_COUNT"

          echo ""
          echo "更新后的选项预览:"
          sed -n '/^      tag:/,/^      cache_enabled:/p' .github/workflows/AutoBuild.yml

      # ----------------------------------------------------------
      # [4] 提交变更
      #
      # 必须使用 SYNC_TOKEN（细粒度 PAT），不能用默认 GITHUB_TOKEN：
      #   GitHub 禁止 GITHUB_TOKEN（GitHub App 身份）创建或修改
      #   .github/workflows/ 下的文件，否则报：
      #     refusing to allow a GitHub App to create or update workflow
      #     `.github/workflows/AutoBuild.yml` without `workflows` permission
      #   该限制已实测无法绕过：
      #     - 在 permissions 块声明 workflows 无效（该权限名不在 schema 中）
      #     - 将仓库 Actions 默认权限改为 Read and write 无效
      #     - 推送到特性分支再开 PR 同样被拒
      #   这是 GitHub 防止 Actions 自我提权的机制。
      #
      # SYNC_TOKEN 需为细粒度 PAT，权限：
      #   Contents : Read and write
      #   Workflows: Read and write
      # 配置路径：仓库 Settings -> Secrets and variables -> Actions
      # ----------------------------------------------------------
      - name: "[4] 提交变更"
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          echo "=========================================="
          echo "  提交变更"
          echo "=========================================="

          # ----------------------------------------------------------
          # 防呆守卫：阻止将来的调试语句把 SYNC_TOKEN 写进公开日志
          #
          # 本仓库是 public，运行日志任何人可见。GitHub 只遮蔽「注册 secret
          # 的原始值」，对拼接或编码后的派生值无效，所以最稳的做法是让这类
          # 语句压根进不了执行路径。
          #
          # 实现说明：检查目标以变量拼接给出（而非字面量），因此这段守卫
          # 代码本身不会撞上自己的检测规则。
          # ----------------------------------------------------------
          SCRIPT_PATH="$GITHUB_WORKSPACE/.github/workflows/SyncVersions.yml"
          K_ENV="e""nv"
          K_PE="print""env"
          V_TOK='$''SYNC_TOKEN'
          V_GHT='$''GITHUB_TOKEN'

          # 1) 立即关闭命令回显：即使有人为调试加了 set -x，此处强制关掉
          set +x

          # 2) 静态检查所有 run 块（YAML 与 shell 的注释行均跳过）
          if awk -v e="$K_ENV" -v pe="$K_PE" -v tok="$V_TOK" -v ght="$V_GHT" '
            /^[[:space:]]*run:[[:space:]]*\|/ { inrun=1; next }
            inrun && !/^[[:space:]]/        { inrun=0 }
            !inrun                          { next }
            { line=$0; sub(/^[[:space:]]*/, "", line); if (line ~ /^#/) next }
            /set[[:space:]]+-[a-zA-Z]*x/    { print "::error::检测到 set -x，会回显命令与环境变量"; bad=1 }
            /set[[:space:]]+-[a-zA-Z]*o[[:space:]]+xtrace/ { print "::error::检测到 set -o xtrace"; bad=1 }
            {
              if (index(line, e) > 0 && line !~ /^env:/) { print "::error::检测到裸 " e " 命令，会打印全部环境变量"; bad=1 }
              if (index(line, pe) > 0) { print "::error::检测到 " pe " 命令，会打印全部环境变量"; bad=1 }
              if (index(line, tok) > 0 || index(line, ght) > 0) { print "::error::检测到直接展开敏感变量"; bad=1 }
            }
            END { exit (bad ? 1 : 0) }
          ' "$SCRIPT_PATH"; then
            echo "[OK] 安全自检通过"
          else
            echo "::error::安全自检未通过，拒绝执行（本仓库为 public，运行日志公开可见）"
            echo "         请移除上述调试语句后重试"
            exit 1
          fi

          # 3) 自检：确认 SYNC_TOKEN 已注入（只报长度，绝不回显内容）
          if [ -n "$SYNC_TOKEN" ]; then
            echo "[OK] 凭据已注入（长度 ${#SYNC_TOKEN}）"
          fi

          if git diff --quiet; then
            echo "[OK] 无变化，跳过提交"
            exit 0
          fi

          LATEST=$(head -1 tags.txt)

          # 未配置 PAT：给出明确指引，而不是无意义地失败
          if [ -z "$SYNC_TOKEN" ]; then
            CURRENT=$(sed -n '/^      tag:/,/^      cache_enabled:/p' .github/workflows/AutoBuild.yml \
              | grep '^          - ' | sed 's/^          - //' | tr -d '"' | tr '\n' ' ')
            DESIRED=$(printf 'latest %s' "$(head -n "$KEEP_COUNT" tags.txt | tr '\n' ' ')")

            echo ""
            echo "::error::未配置 SYNC_TOKEN，无法提交对工作流文件的修改"
            echo ""
            echo "【为什么需要】"
            echo "  GitHub 不允许默认 GITHUB_TOKEN 修改 .github/workflows/ 下的文件"
            echo "  （防止 Actions 自我提权），该限制无法通过仓库设置绕过。"
            echo ""
            echo "【配置步骤】"
            echo "  1. 打开 https://github.com/settings/personal-access-tokens/new"
            echo "  2. Repository access 仅选 AutoBuild-ImmortalWrt"
            echo "  3. Permissions 勾选："
            echo "       Contents  : Read and write"
            echo "       Workflows : Read and write"
            echo "  4. 生成后复制 token"
            echo "  5. 打开 https://github.com/lmwm/AutoBuild-ImmortalWrt/settings/secrets/actions"
            echo "  6. New repository secret，名称 SYNC_TOKEN，值粘贴 token"
            echo ""
            echo "【本次应更新的内容】"
            echo "  上游最新: ${LATEST}"
            echo "  当前选项: ${CURRENT}"
            echo "  期望选项: ${DESIRED}"
            echo ""
            echo "（配置 SYNC_TOKEN 后重跑本工作流即可自动完成）"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/AutoBuild.yml
          git commit -m "配置: 同步 ImmortalWrt 版本标签（最新 ${LATEST}）"

          echo "[OK] 已提交，开始推送"
          for attempt in 1 2 3; do
            # 注意：不能用 `if git push ... | sed ...`，那判断的是 sed 的退出码，
            # 会把推送失败误判为成功。这里直接判断 git 的退出码。
            # 凭证来自 [1] checkout 注入的 SYNC_TOKEN，无需在此重复传递。
            if git push origin HEAD:main; then
              echo "[OK] 推送成功（第 ${attempt} 次尝试）"
              exit 0
            fi
            echo "[WARN] 推送失败，10 秒后重试（第 ${attempt}/3 次）"
            sleep 10
          done

          echo "::error::推送失败，已重试 3 次"
          exit 1

