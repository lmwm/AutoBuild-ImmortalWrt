#
# 同步版本标签
# 仓库：https://github.com/lmwm/AutoBuild-ImmortalWrt
#
# 目的：让 AutoBuild.yml 中 tag 的下拉选项保持最新，避免手动输入版本号出错。
#
# 背景：GitHub Actions 的 workflow_dispatch 下拉选项（type: choice）必须在
#       工作流文件中静态列出，官方不支持在运行时动态生成。因此这里用定时
#       工作流从上游拉取标签，自动改写 AutoBuild.yml 的 options。
#
# 行为：
#   - 每周一 03:00 UTC 自动运行，也可手动触发
#   - 拉取上游全部正式标签（排除 -rc 等预发布版本）
#   - 保留最新的 KEEP_COUNT 个，重新写入 AutoBuild.yml 的 tag.options
#   - 无变化则不做任何提交
#   - 有变化则推送到 sync-versions 分支并创建 PR，需人工合并后生效
#     （原因：GITHUB_TOKEN 无权直接修改 .github/workflows/ 下的文件，
#       详见 [4] 步骤注释）
#
# 实际改写逻辑见 .github/scripts/SyncTags.py
#
# 注意：GitHub 对长期无活动的仓库会停用定时工作流。本仓库会持续触发编译，
#       通常不会遇到；若发现下拉列表长期未更新，手动触发本工作流即可。
#

name: "同步版本标签"

on:
  schedule:
    # 每周一 03:00 UTC（北京时间 11:00）
    - cron: '0 3 * * 1'
  workflow_dispatch:

env:
  # 下拉列表中保留的历史版本数量
  KEEP_COUNT: 8

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    name: "同步版本标签"
    timeout-minutes: 15

    steps:
      - name: "[1] 克隆配置仓库"
        uses: actions/checkout@v4

      - name: "[2] 获取上游版本标签"
        run: |
          echo "=========================================="
          echo "  获取 ImmortalWrt 版本标签"
          echo "=========================================="

          UPSTREAM="https://github.com/immortalwrt/immortalwrt.git"

          for attempt in 1 2 3; do
            if git ls-remote --tags --sort=-v:refname "$UPSTREAM" > tags_raw.txt 2>/dev/null; then
              # 只保留形如 v25.12.1 的正式版本，排除 -rc / -beta 等预发布
              grep -oP 'refs/tags/\Kv[0-9.]+$' tags_raw.txt | awk '!seen[$0]++' > tags.txt || true
              if [ -s tags.txt ]; then
                echo "[OK] 标签获取成功（第 ${attempt} 次尝试）"
                break
              fi
            fi
            echo "[WARN] 获取标签失败，5 秒后重试（第 ${attempt}/3 次）"
            sleep 5
          done

          if [ ! -s tags.txt ]; then
            echo "::error::无法从上游获取版本标签"
            exit 1
          fi

          TOTAL=$(wc -l < tags.txt)
          echo "[OK] 上游共有 ${TOTAL} 个正式版本，最新在前:"
          sed 's/^/  - /' tags.txt | head -20

      - name: "[3] 更新 AutoBuild.yml 的下拉选项"
        run: |
          echo "=========================================="
          echo "  更新 AutoBuild.yml 选项"
          echo "=========================================="

          python3 .github/scripts/SyncTags.py \
            .github/workflows/AutoBuild.yml \
            tags.txt \
            "$KEEP_COUNT"

          echo ""
          echo "更新后的选项预览:"
          sed -n '/^      tag:/,/^      cache_enabled:/p' .github/workflows/AutoBuild.yml

      # ----------------------------------------------------------
      # [4] 提交变更（通过 Pull Request）
      #
      # 为什么不直接 push：
      #   GitHub 禁止 GITHUB_TOKEN（GitHub App 身份）直接创建或修改
      #   .github/workflows/ 下的文件，否则报：
      #     refusing to allow a GitHub App to create or update workflow
      #     `.github/workflows/AutoBuild.yml` without `workflows` permission
      #   该 workflows 权限既不能在 workflow 的 permissions 块中声明，
      #   也无法通过仓库的 Actions 默认权限设置授予（已实测无效）。
      #   这是 GitHub 防止 Actions 自我提权的机制。
      #
      # 因此改为推送到独立分支并开 PR，由仓库管理员审核合并：
      #   合并 PR -> 由人工动作改动 workflow 文件，符合 GitHub 的权限模型
      #   引用：https://github.com/orgs/community/discussions/25266
      #
      # 若不想每次合并 PR，可给本工作流配置带 workflow 权限的 PAT
      # （存为 secret 并 checkout 时使用），即可恢复直接 push。
      # ----------------------------------------------------------
      - name: "[4] 提交变更（创建 PR）"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=========================================="
          echo "  提交变更"
          echo "=========================================="

          if git diff --quiet; then
            echo "[OK] 无变化，跳过"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          LATEST=$(head -1 tags.txt)
          BRANCH="sync-versions"

          echo "变更内容预览:"
          git --no-pager diff --stat

          # 推送到独立分支（分支内容不受 workflows 权限限制）
          git checkout -B "$BRANCH"
          git add .github/workflows/AutoBuild.yml
          git commit -m "配置: 同步 ImmortalWrt 版本标签（最新 ${LATEST}）"

          echo "[OK] 已提交，推送分支 ${BRANCH}"
          for attempt in 1 2 3; do
            if git push -f origin "$BRANCH"; then
              echo "[OK] 分支推送成功（第 ${attempt} 次尝试）"
              break
            fi
            echo "[WARN] 分支推送失败，10 秒后重试（第 ${attempt}/3 次）"
            sleep 10
            if [ "$attempt" = "3" ]; then
              echo "::error::分支推送失败，已重试 3 次"
              exit 1
            fi
          done

          # 复用已存在的 PR，避免重复创建
          PR_EXISTS=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length' 2>/dev/null || echo "0")
          if [ "$PR_EXISTS" != "0" ]; then
            echo "[OK] 已存在打开的 PR，分支已更新，无需重复创建"
            gh pr list --head "$BRANCH" --state open
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "配置: 同步 ImmortalWrt 版本标签（最新 ${LATEST}）" \
            --body-file - <<EOF
          本 PR 由「同步版本标签」工作流自动生成。

          ## 变更内容

          更新 AutoBuild.yml 中 tag 的下拉列表，最新版本为 ${LATEST}。

          ## 为什么是 PR 而不是直接提交

          GitHub 禁止 GITHUB_TOKEN 直接修改 .github/workflows/ 下的文件（防止 Actions 自我提权），因此改为提交 PR，由人工合并。

          ## 合并方式

          确认版本列表无误后合并本 PR，编译工作流的下拉选项即会更新。
          EOF

          echo "[OK] PR 已创建"
